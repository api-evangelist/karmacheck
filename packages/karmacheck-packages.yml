impact: >-
  With no SDK and no CLI, every KarmaCheck integration is hand-rolled against the OpenAPI. That
  raises the value of the contract itself — and makes the fact that KarmaCheck's consolidated
  openapi.json export sits behind a login (HTTP 302) the sharpest single friction point in the
  developer experience.
