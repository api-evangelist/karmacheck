detail: >-
  KarmaCheck ships NO client libraries. Every registry queried returned nothing first-party and the
  documentation never references an SDK — the reference shows raw curl for every operation, and the
  API basics page tells integrators to export the OpenAPI and import it into an API client such as
  Postman rather than pointing at a library. There is also no public source presence: no GitHub
  organization exists under karmacheck, KarmaCheck or karmacheckinc.
