decline_codes:
  applicable: false
  note: >-
    Not a payments or authorization API. There is no decline-code registry, and the adjudication
    outcomes (clear / consider / acknowledge / needs review) are screening RESULTS carried in case
    data, not error codes — they are documented in the service lifecycle reference and modelled in
    data-model/karmacheck-data-model.yml.
