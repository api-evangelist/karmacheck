    countries: get-candidate-countries
  relationships:
  - has_many: Case
    via: candidateId
  - has_many: Testimony
  - has_one: Invitation
  note: >-
    Candidate uniqueness is enforced on EMAIL within a group — creating a second case for the same
    email in the same group returns 409 with the conflicting cases.
