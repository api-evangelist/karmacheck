method: derived
source: >-
  openapi/karmacheck-api-openapi.yml (125 component schemas, 69 operations) +
  https://developer.karmacheck.com/background-check-api/overview/case-lifecycle +
  https://developer.karmacheck.com/background-check-api/overview/service-lifecycle
summary: >-
  The KarmaCheck domain has one spine: a COMPANY contains GROUPS, a group orders a CASE for a
  CANDIDATE against a PACKAGE, and the case fans out into many CASE DATA records — one per
  individual screening (service). Everything else hangs off that spine: order data supplies the PII
  a screening needs, testimony records the candidate's self-reported history, secure documents carry
  the evidence, and legal acknowledgements carry the FCRA paper trail. Identifiers are opaque UUIDs
  with NO type prefix, which means an id alone does not tell you what it is.
id_convention:
  format: UUID v4
  prefixed: false
  note: >-
    KarmaCheck uses bare UUIDs everywhere (caseId, candidateId, packageId, serviceTypeId,
    secureDocumentId, cplcId). Unlike prefixed-id APIs there is no way to tell a caseId from a
    candidateId by looking at it, so an agent must track which field a value came from.
entities:
- name: Case
  schema: CaseSummary
  description: >-
    The order. One background check report on one candidate, ordered against one package by one
    group. Carries a primary status, a secondary status and a result type.
  key: id
  operations:
    create: post-case-create
    read: get-case-id-caseid
    list:
    - get-case-list
    - get-case-list-all
    cancel: post-case-id-caseId-cancel
    archive: post-case-archive-caseId
    unarchive: post-case-unarchive-caseId
  relationships:
  - has_one: Candidate
    via: candidateId
  - has_one: Package
    via: packageId
  - has_many: CaseData
    via: caseId
  - has_many: Service
    via: get-case-id-caseId-services
  - has_one: Invitation
    via: caseInvitationId
  - has_one: Group
    via: groupProfileId
  - has_one: Company
    via: companyId
  - has_one: AdverseAction
    via: adverseActionId
  - belongs_to: Case
    via: replaceCaseId
    note: A case can replace an earlier case; the replaced case moves to Canceled.
  status_model:
    primary: CaseStatus (Pending, Blocked, Complete, Consider, Adjudicated, Placed, Canceled)
    secondary: CaseSecondaryStatus (e.g. Waiting for Authorization, Authorization in Progress)
    result: CaseResult (Open, Placed, ...)
    docs: https://developer.karmacheck.com/background-check-api/reference/case-status
  timestamps:
  - orderedStamp
  - beginOnboardingStamp
  - completedOnboardingStamp
  - beginProcessingStamp
  - completedInitialProcessingStamp
  - completedLatestProcessingStamp
- name: CaseData
  schema: CaseData
  description: >-
    One individual screening on a case — the unit that actually gets a result. This is the most
    polymorphic object in the model: a single CaseData carries exactly one of 22 `Details*` payloads
    selected by its service category.
  key: id
  operations:
    read: get-case-id-caseid-data-servicetypeid
    cancel_search: post-case-data-id-caseDataId-search-id-searchId-cancel
    pdf: get-case-id-caseId-data-serviceId-pdf
  relationships:
  - belongs_to: Case
    via: caseId
  - has_one: Service
    via: serviceId
  - has_one: ServiceType
    via: serviceTypeId
  - has_one: ServiceCategory
    via: serviceCategoryId
  - has_one: CaseDataStatus
    via: statusId
  - has_one: Candidate
    via: candidateId
  polymorphic_details:
  - DetailsSSN
  - DetailsIdentity
  - DetailsNationalCriminal
  - DetailsFederalCriminal
  - DetailsCountyCriminal
  - DetailsStateCriminalCourt
  - DetailsStateCriminalDatabase
  - DetailsSexOffender
  - DetailsGlobalWatchlist
  - DetailsOIG
  - DetailsFACIS
  - DetailsInternational
  - DetailsMotorVehicle
  - DetailsEducation
  - DetailsEmployment
  - DetailsCPLC
  - DetailsDrug
  - DetailsOHS
  - DetailsLegal
  - DetailsMaskShipment
  - DetailsPayment
  - DetailsOtherService
- name: Candidate
  description: The person being screened. Email address is the practical unique key within a group.
  key: candidateId
  operations:
