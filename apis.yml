apis:
- aid: karmacheck:karmacheck-api
  name: KarmaCheck API
  description: 'REST API for ordering and tracking background checks, credential verifications and
    occupational health screenings. 69 operations across 62 paths covering authentication, cases,
    candidate onboarding and disclosures, packages, services, secure documents, users and the
    verification book. Authenticated with a JWT bearer token minted by POST /auth/api from an apiKey
    and a clientAccessToken issued by KarmaCheck. Staging and production environments are separated
    by host, and staging accepts predefined test SSNs that drive simulated clear / needs-review
    results.'
