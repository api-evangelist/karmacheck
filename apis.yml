aid: karmacheck
name: KarmaCheck
description: 'KarmaCheck Inc. is a San Francisco based, API-first background check and credential
  verification company serving staffing, healthcare, gig-economy, call-center and IT/tech hiring
  workflows. The KarmaCheck API is a REST contract on api.karmacheck.io covering the full screening
  lifecycle: creating and placing cases, candidate onboarding with FCRA, e-signature, Canada,
  international and location-specific disclosure acknowledgement, criminal, identity, motor vehicle
  record, education, employment, professional-licence and occupational-health screenings, secure
  document upload and retrieval, package and service catalogs, jurisdiction lookup, verification-book
  search, adjudication and pre-adverse-action documents. Results are pushed asynchronously through
  Svix-delivered, HMAC-SHA256 signed webhooks (case.statuschange and casedata.statuschange).
  KarmaCheck also operates a remote MCP server so agents can order and track screenings from natural
  language, and integrates with Bullhorn, Workday and symplr CTM. The company holds a SOC 2 Type 2
  report and operates as an FCRA consumer reporting agency.'
