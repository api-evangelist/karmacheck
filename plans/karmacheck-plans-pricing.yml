what_is_published:
- name: Passthrough fees policy
  url: https://www.karmacheck.com/passthrough-fees-aliases
  type: fee-disclosure
  detail: >-
    KarmaCheck does publish a passthrough-fee disclosure, which is a pricing MECHANIC rather than a
    price. Third-party fees charged by courts, registries, drug testing facilities, education and
    employment verification sources are billed through to the customer as a separate invoice line
    item, are not set by KarmaCheck, and may change without notice. Credit card processing fees are
    also passed through and can be avoided by paying via ACH or check.
  implication_for_agents: >-
    An agent ordering a screening cannot compute the cost of the call in advance from anything
    KarmaCheck publishes. Neither the base fee nor the passthrough component is discoverable, and
    the passthrough component is explicitly variable without notice.
