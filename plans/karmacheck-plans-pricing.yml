detail: >-
  KarmaCheck publishes NO pricing. There is no pricing page — https://www.karmacheck.com/pricing
  returns HTTP 404 — no /pricing entry in sitemap.xml, no rate card, no per-screening list price and
  no plan tiers anywhere on the marketing site or the developer portal. Every commercial path is a
  form: "Contact Us", "Get an account" and "Book a demo" all route to
  https://contact.karmacheck.com/contact-sales, and API credentials themselves are issued by an
  account manager rather than self-serve. Production MCP access adds a second gate on top —
  a waitlist at https://contact.karmacheck.com/mcp-production-wl followed by contracting and
  credentialing.
