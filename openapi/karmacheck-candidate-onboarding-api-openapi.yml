                    alreadyAck: true
        '403':
          description: Forbidden
        '404':
          description: The case was not found.
        '422':
          description: The case does not have the disclosure-type requested as a requirement, or the request body has missing or invalid fields.
        '500':
          description: Internal Server Error
  /invitation/candidate/create:
    post:
      tags:
      - Candidate onboarding
      summary: Create candidate by proxy for invitation
      description: 'Creates the candidate object in KarmaCheck on behalf of the candidate so that there can be pre-population of PII before the candidate accepts an invitation and enters the system.

        The candidate will be directed to onboard the associated case via the one-time token link that will be provided by the API partner.


        This API marks the candidate object as not secured in the KarmaCheck system, which results in the candidate being prompted to set a password when the onboarding of the case begins.

        After this call is complete, the candidate will be associated with the specific `caseId` that was attached to the invitation. The `caseId` will be used for saving all further case data, such as authorizations and acknowledgements. This assumes that a candidate will need to sign up with KarmaCheck before being able to continue to accept the invitation.

        '
      operationId: post-invitation-candidate-create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - caseInvitationId
              - email
              - password
              properties:
                caseInvitationId:
                  type: string
                email:
                  type: string
                  description: The candidate's email address.
                password:
                  type: string
                  description: The password for the candidate's account. The supplied password must be at least eight characters long and must contain a lowercase letter, an uppercase letter, a number, and a special character.
                givenName:
                  type: string
                middleName:
                  type: string
                familyName:
                  type: string
                dob:
                  type: string
                  description: The candidate's birthdate in the format *YYYY*-*MM*-*DD*.
                  format: date
                phone:
                  type: string
                govtId:
                  type: string
            examples:
              Example 1:
                value:
                  caseInvitationId: e1f27fde-8ec3-4fa2-abfe-43b7c9f43084
                  email: john.lee@example.com
                  password: Password!1
                  givenName: John
                  middleName: Michael
                  familyName: Lee
                  dob: '1980-09-19'
                  phone: 800-555-0142
                  govtId: 111-11-1111
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId:
                    type: string
                  candidateId:
                    type: string
              examples:
                Example 1:
                  value:
                    caseId: af51d69f-996a-4891-a745-aadfcdec225a
                    candidateId: 10f4deb6-fd4e-4907-a47e-355caf6e449d
        '400':
          description: An invalid `email`, `password`, or `dob` format was passed.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: An invalid `caseInvitationId` was passed.
        '422':
          description: 'The candidate cannot be created due to one of the following:


            - The invitation expired.

            - The invitation was deleted.

            - The invitation was completed.

            - The invitation is already associated with another candidate.

            - An account already exists for the candidate.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId:
                    type: string
                  candidateId:
                    type: string
        '500':
          description: Internal Server Error
      security:
      - JWT: []
  /testimony/create/case/id/{caseId}:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The identifier of the case for which to create a testimony.
    post:
      tags:
      - Candidate onboarding
      summary: Create testimony for case
      description: 'Stores personally identifiable information (PII) on a candidate in KarmaCheck. Only one piece of PII can be included in a single piece of testimony.


        Testimony is owned by the candidate, and can be attached to a case. When testimony is attached to a case, a separate case testimony record is created, which then becomes part of the case.'
      operationId: post-testimony-create-case-id-caseId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Testimony'
            examples:
              Education testimony:
                value:
                  testimonyTypeId: 19edb27e-5bfd-4c0f-888a-a5130b2f5250
                  details:
                    institution: UCLA
                    city: Los Angeles
                    state: CA
                    country: US
                    educationType: College/University
                    current: false
                    degree: B.S.
                    major: Nursing
                    monthBegin: September
                    yearBegin: '2015'
                    monthEnd: May
                    yearEnd: '2019'
              Professional License and Certification testimony:
                value:
                  testimonyTypeId: testimony-type-cplc
                  testimonySubType: 512d0d24-a4bd-4b1d-b6d1-182247a0f6ec
                  details:
                    cplcId: 512d0d24-a4bd-4b1d-b6d1-182247a0f6ec
                    fields:
                    - fieldId: certifyingBody
                      value: AMTA
                    - fieldId: licenseNumber
                      value: M123456
                    - fieldId: firstName
                      value: John
                    - fieldId: lastName
                      value: Smith
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    description: The unique identifier of the testimony created.
                    format: uuid
              examples:
                Example 1:
                  value:
                    id: e0c9c732-68ea-4f73-857d-d37f1c9e2028
        '403':
          description: Forbidden
        '422':
          description: The request data is invalid or incomplete.
        '500':
          description: Internal Server Error
  /testimony/id/{testimonyId}/detach/case/id/{caseId}:
    parameters:
    - in: path
      name: testimonyId
      required: true
      description: The ID of the testimony to remove from a case.
