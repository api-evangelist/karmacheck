                      employment:
                      - id: 497f6eca-6276-4993-bfeb-53cbbbba6f08
                        employer: Example Employer
                        city: San Clemente
                        state: CA
                        country: US
                        current: true
                        okToContact: true
                        position: Nurse
                        monthBegin: August
                        yearBegin: '2010'
                      customProfessionalLicense: []
        '403':
