  /case/id/{caseId}/action/refreshinvite:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The ID of the case to refresh the invitation for.
    put:
      tags:
      - Candidate onboarding
      summary: Refresh invitation for case
      description: 'Refreshes the expiration date for an existing invitation.


        When an onboarding invitation is generated, the candidate has 14 days (the default expiration period) to begin and complete their onboarding, or else the link in their invitation email becomes invalid.


        As long as the invitation is refreshed during the 14-day period, enough time will be added so that the candidate has 14 days to complete onboarding. For example, if only 1 day remains, 13 days will be added. If 12 days still remain, only 2 days will be added.


        Note that for your cases that don''t rely on the candidate to onboard, such as those that use the customer PII entry feature, you''ll never need to call this API.'
      operationId: put-case-id-caseId-action-refreshinvite
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '422':
          description: The candidate already began or finished onboarding.
        '500':
          description: Internal Server Error
      security:
      - JWT: []
  /case/id/{caseId}/action/resendinvite:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The ID of the case to resend an invitation for.
    post:
      tags:
      - Candidate onboarding
      summary: Resend case invitation
      description: 'Resends the invitation email for a case. Note that a case can have only one active invitation at a time, and resending the invite actually creates and sends a new invitation with a new ID.


        This means that the link in an old invitation email will stop working, so make sure to update any references to the old invitation in order to use the new one.'
      operationId: post-case-id-caseId-action-resendinvite
      parameters:
      - schema:
          type: string
        name: caseId
        in: path
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OK
        '403':
          description: Unauthorized Request
        '422':
          description: 'Could not resend the invitation. This can be due to one of the following:


            - A data issue

            - Existing invitation was already used to create a candidate'
        '500':
          description: Server Error
  /candidate/id/{candidateId}/update/case/id/{caseId}:
    parameters:
    - schema:
        type: string
      name: candidateId
      in: path
      required: true
      description: The identifier of a candidate.
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The identifier of a case associated with the candidate.
    post:
      tags:
      - Candidate onboarding
      summary: Update candidate for case
      description: Sets modifiable data for a candidate.
      operationId: post-candidate-id-candidateId-update-case-id-caseId
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Cannot be changed once PII is locked. Value provided cannot already be associated with another candidate.
                  format: email
                dob:
                  type: string
                  format: date
                  description: Cannot be changed once PII is locked.
                  example: '1987-01-30'
                givenName:
                  type: string
                  description: Cannot be changed once PII is locked. Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and underscores (_) are allowed.
                middleName:
                  type:
                  - string
                  - 'null'
                  description: Cannot be changed once PII is locked. Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and underscores (_) are allowed.
                familyName:
                  type: string
                  description: Cannot be changed once PII is locked. Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and underscores (_) are allowed.
                phone:
                  type:
                  - string
                  - 'null'
                  pattern: ^\+\d+$
                  example: '+18005550164'
                govtId:
                  type:
                  - string
                  - 'null'
                  description: Cannot be changed once PII is locked, but can still be set if the current value is `null`.
            examples:
              Before PII lock:
                value:
                  email: dwight@example.com
                  dob: '1991-04-05'
                  givenName: Dwight
                  familyName: Miller
                  middleName: James
                  phone: '+18005550164'
                  govtId: null
              After PII lock:
                value:
                  phone: '+18005550164'
                  govtId: 333-22-1111
        description: 'All fields in the request are optional, so only those that are passed in will be set or updated. Any fields left out of the request will keep their existing values.


          Some fields are nullable, so passing in an empty string or `null` will update the field to be an empty string or `null`.


          Some fields cannot be an empty string or `null`, in which case passing in such values will cause the call to fail.


          After a candidate''s first case begins processing, their personally indentifiable information (PII) will be locked, and only their `phone` can be updated. Their `govtId` can be set if it hasn''t been already, but cannot be updated. Call [Get candidate info for case](paths/~1candidate~1info~1case~1id~1{caseId}/get) to check whether a candidate has their PII locked.'
      responses:
        '200':
          description: This response will be returned as long as at least one valid update is made. The invalid fields will simply be ignored.
        '400':
          description: 'This response will be returned if the request didn''t contain at least one valid update, such as by attempting to update only PII fields after PII has been locked. '
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /testimony/id/{testimonyId}/update/case/id/{caseId}:
    parameters:
    - in: path
      name: testimonyId
      required: true
      description: The identifier of the testimony record to update.
      schema:
        type: string
    - in: path
      name: caseId
      required: true
      schema:
        type: string
      description: The identifier of the case that the testimony is attached to.
    post:
      tags:
      - Candidate onboarding
      summary: Update testimony for case
      description: Updates testimony associated with a case.
      operationId: post-testimony-id-testimonyId-update-case-id-caseId
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Testimony'
            examples:
              Example 1:
                value:
                  testimonyTypeId: 19edb27e-5bfd-4c0f-888a-a5130b2f5250
                  details:
                    institution: UCLA
                    city: Los Angeles
                    state: CA
                    country: US
                    educationType: College/University
                    current: false
                    degree: B.S.
                    major: Nursing
                    monthBegin: September
                    yearBegin: '2015'
                    monthEnd: May
                    yearEnd: '2019'
        description: To properly update an existing testimony record, the value for `testimonyTypeId` must be the same as the one used to [create the testimony](paths/~1testimony~1create~1case~1id~1{caseId}/post).
      responses:
        '200':
          description: 'The call was successful, but note the following behavior:


            - If the testimony is *not* attached to other cases, the record will be updated and the `testimonyId` returned will be the same as the `testimonyId` supplied.

            - If the testimony *is* attached to other cases, the record will be detached from this case, unmodified. Then, a new testimony record will be created with the data in the request and attached to the case. The new record''s `testimonyId` will be in the response, and so it is the caller''s responsibility to save and use the new ID as needed. This is because a testimony record become read-only once it''s used in the processing of a case.'
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    description: The identifier of the updated or newly created testimony record.
                    format: uuid
              examples:
                Example 1:
                  value:
                    id: 83b7eaf3-0409-4863-9709-14e28ab9cfa7
        '403':
          description: The case has begun processing, so testimony can no longer be modified.
        '404':
          description: The `testimonyId` provided is not associated with the `caseId`.
        '422':
          description: 'The request data is invalid or incomplete.


            **Known issue:** The API returns a 500 response instead of a 422 when this error occurs.'
        '500':
          description: Internal Server Error
