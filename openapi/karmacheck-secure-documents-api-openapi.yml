        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - list
                properties:
                  list:
                    type: array
                    description: A list of MIME types that can be uploaded to KarmaCheck as secure documents.
                    items:
                      type: string
              examples:
                Example 1:
                  value:
                    list:
                    - application/epub+zip
                    - application/msword
