openapi: 3.2.0
info:
  title: KarmaCheck Secure documents API
  description: 'All requests to the KarmaCheck API require a JSON Web Token (JWT) in the Authorization header. For an overview of the API and its authentication method, refer to the following topics:


    - [API basics](docs/overview/apis/api-overview.md)

    - [Authentication](docs/overview/apis/authentication.md)

    - [Environments](docs/overview/apis/environments.md)

    - [Status codes and errors](docs/overview/apis/errors.md)'
  version: '1.0'
  contact:
    name: KarmaCheck
    email: customersuccess@karmacheck.com
servers:
- description: Stage
  url: https://api-stage.karmacheck.io
- description: Prod
  url: https://api.karmacheck.io
security:
- JWT: []
tags:
- name: Secure documents
paths:
  /document/secure/create:
    parameters: []
    post:
      tags:
      - Secure documents
      summary: Create secure document records
      description: 'Creates secure document records in the KarmaCheck system and associates uploaded documents with an existing case.


        This is step 3 of 3 when adding documents to KarmaCheck. At this stage, you should have successfully uploaded your documents via the URLs obtained from the [Generate secure document upload URLs](paths/~1document~1secure~1upload/post) API call. The uploaded documents are unavailable for use in KarmaCheck until they are associated with a case in this third step.


        Document associations are identified by sending access grants. If your token does not have access to associate a document with a specific entity, a 403 Forbidden response will be returned.


        In addition to associating a document with an existing case, you can call this API to create candidate disclosure and authorization document records before a case is created. When [creating a case](paths/~1case~1create/post), you can send the newly created document IDs to associate these documents with the case and the candidate. Note that this association is allowed only when the document type is a candidate disclosure or authorization.'
      operationId: post-document-secure-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreateRecords'
              x-examples:
                Example 1:
                  list:
                  - originalFileName: example_document.jpg
                    documentTypeId: candidate-disclosures-and-authorizations
                    fileKey: 1daa3c43-ea4e-4d66-9330-0cbd197feee6
                  accessGrants:
                    caseId: 22e88848-17d1-4946-bbac-18d44f381ca7
            examples:
              Candidate disclosure document:
                value:
                  list:
                  - originalFileName: example_document.jpg
                    documentTypeId: candidate-disclosures-and-authorizations
                    fileKey: 1daa3c43-ea4e-4d66-9330-0cbd197feee6
                  accessGrants:
                    caseId: 22e88848-17d1-4946-bbac-18d44f381ca7
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRecords'
                x-examples:
                  Example 1:
                    list:
                    - secureDocumentId: 7225e58b-55a3-49ad-af82-2b3ab9595741
              examples:
                Example 1:
                  value:
                    list:
                    - secureDocumentId: f6723gd8-ee70-4db3-b238-6bb27abf66c0
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '413':
          description: Request Entity Too Large
        '500':
          description: Internal Server Error
  /document/secure/upload:
    post:
      tags:
      - Secure documents
      summary: Generate secure document upload URLs
      description: 'Generates short-lived URLs that can be used to upload one or more secure documents to the KarmaCheck system. This API call is step 1 of 3 when adding a document to the system and linking it to a case.


        The returned URLs expire after 1 hour. If an attempt to use an expired URL occurs, the server responds with a 403 HTTP status code.'
      operationId: post-document-secure-upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFiles'
            examples:
              Example 1:
                value:
                  files:
                  - documentTypeId: candidate-disclosures-and-authorizations
                    mimeType: application/pdf
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - list
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      required:
                      - url
                      - fileKey
                      properties:
                        url:
                          type: string
                          format: uri
                          description: The URL to upload the document to. This expires after 1 hour.
                        fileKey:
                          type: string
                          description: The identifier used to reference the file in KarmaCheck's storage system. This must be included in the [Create secure document records](karma-api-openapi.yaml/paths/~1document~1secure~1create/post) call.
              examples:
                Example 1:
                  value:
                    list:
                    - url: https://s3.amazonaws.com/dev.private.storage-bin.karmacheck.io/b92fef93-437f-4a05-adb7-182357b8a1f0?AWSAccessKeyId=REDACTED_AWS_ACCESS_KEY_ID&Content-Type=image%2Fjpeg&Expires=1710031824&Signature=x0e6I7GZFOJLUe%2FTkRmDjoNmNvc%3D&X-Amzn-Trace-Id=Root%3D1-65ecf5c0-4c1e58d24ba6707d02d69e20%3BParent%3D3898fdce19660298%3BSampled%3D0%3BLineage%3De3b20767%3A0&x-amz-security-token=FwoGZXIvYXdzEBEaDLO5SgCTmUgIMZ7bNyK5AUBiY%2B5i0%2B8%2Fcg8Y0XFmpfLWBqhmstkdrK3uF79EMlgDjWpX%2FqgRisuvbPzFFOZ9K1dgSorlUAPgTYIXKGdadO3ZsdsVTaL4kAZDX5qQNa%2FnP%2BFB9SVgqa6F4%2FIaBzA1aDiqs7w%2Ft7tGounuPV42O86V6ig3cuBHcx9%2BUOcd9mbJ2GGytKjDrZ7PBfIJimKy0tMFaFaTSCVIPcMVyqUe1%2BGFTHtc8686WQFpIW34Ff06SzPZmfQTVRcFKKXrs68GMi2QMcUwY0v194kGFN3WaGw1sqIqab3xJLwKXQGR4GbQUwiQHMK6Ws7cg4Hesx4%3D
                      fileKey: b92fef93-437f-4a05-adb7-182357b8a1f0
        '400':
          description: 'Bad Request


            - An invalid or unsupported document type was provided.

            - An invalid or unsupported MIME type was provided.'
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /document/secure/id/{secureDocumentId}/download/url:
    parameters:
    - schema:
        type: string
      name: secureDocumentId
      in: path
      required: true
      description: The ID of the document to download.
    get:
      tags:
      - Secure documents
      summary: Get secure document download URL
      description: Gets a URL from KarmaCheck, which can then be used to download a secure document. The URL will be valid for only 60 minutes, but once the download begins, the download can take as long as needed. The URL can also be reused as many times as needed during the 60-minute validity period.
      operationId: get-document-secure-id-secureDocumentId-download-url
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
              examples:
                Example 1:
                  value: https://s3.amazonaws.com/stage.private.storage-bin.karmacheck.io/escreen-gkfQxkAStpb7VxOw9gsT-doc-ohs-occupational-health.pdf?AWSAccessKeyId=REDACTED_AWS_ACCESS_KEY_ID&Expires=1698176316&Signature=JEiJoN04lEsSTk212%2BQeXN7On%2B8%3D&X-Amzn-Trace-Id=Root%3D1-65380f2c-2e8f8372612dc45d463cf244%3BParent%3D51f9b6490fd41e98%3BSampled%3D0%3BLineage%3De3b20767%3A0&x-amz-security-token=FwoGZXIvYXdzEDQaDIDz3VR%2FxjmXT%2Fw2PSK7Acn2jWag5OEjzrRGT37r%2FZWKUfgFrYIceTA401Psv1sTisbuYMbSkdpQWEhM2%2B65%2BZMvO3tuZN9waO7XfCsXK5LpyV79VJobVTs89tjEasjV6WZdiI%2FoHf0qs%2BKPbZeBtvUlvI6xGOrj6KOFKxxF%2BZyxHb8FxUS6CnRf50oiCmyrR4rOMKqFFzUdfC3yS5eVIp2T6sAEl1FZcfsOUKG4eRZ%2BAvSG0It3xXo89ChDIXvXY4AE5ETiBX3yucMorJ7gqQYyLeH7XjvfVyel85XfJsdOrBsimh3CwpZ4ARtPih7y%2F71XLerGQpOhCZhyf1g5Pg%3D%3D
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
