        testimonySubType:
          type: string
          description: Only required for Professional License and Certification testimony, for which you
            must provide the `cplcId` as the `testimonySubType`. For education testimony, this field must
            be provided as `no-testimony-to-verify` if the candidate has no education testimony to verify;
            this provides a form of candidate affirmation that they have no education history to verify.
            Simply leaving off any testimony records in such a scenario will require KarmaCheck Customer
