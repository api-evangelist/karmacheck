  /case/create:
    post:
      tags:
      - Cases
      summary: Create case
      description: 'Orders a background check report and opens a case for tracking. The new case includes
        references to the package. Depending on the values entered in the request, the case goes through
        one of two flows:


        - **Candidate onboarding flow:** The new case will have an initial status of **Pending** and a
        secondary status of **Waiting for Authorization**. An invitation is emailed to the candidate,
        who is required to provide their personally identifiable information (PII) via the invitation
        email.

        - **Customer-provided PII flow:** All PII for the candidate is provided in the request body. Setting
        `autoProcess` to true initiates a case for the candidate and immediately begins processing.


        ### API Integration - Attributing a case to a specific user

        To provide additional insight for API integrations the Create Case API supports an optional header
        that allows an API customer to provide additional information about the end user that is initiating
        the API call through their integration.


        This optional header is only ever used if the API call has a valid authentication token.


        The optional header is `karmacheck-on-behalf-of` and the value that should be provided is an email
        address.


        When the `karmacheck-on-behalf-of` header contains an email address, the server will validate
        the email address provided, and if valid, the user associated with the email address will be recorded
        in the KarmaCheck system as the user that created the associated case.


        When validating the email address that is provided for this header:


        - if there is no user in the KarmaCheck system, then the value will simply be ignored and the
        case creation will be attributed to the authenticated API token itself.

        - if there is a user in the KarmaCheck system associated with the email address, but that user
        does not have the proper access to create a case for the package (or is not a user that is directly
        associated with the calling company) that is being requested then the API call will fail with
        a result that indicates that the user is not authorized to make that call. This error will occur
        even though the API token itself may be allowed to make the call but, because of the conflict,
        the call will be rejected.


        ### Restrictions

        The following restrictions exist when creating a case. Be sure to adhere to these restrictions
        when selecting a package or excluding services from the order (via `excludeServices`).


        #### Criminal and identity screening restrictions


        - SSN Trace is required when a County, State, or Federal Criminal Search is being ordered.

        - Cannot order Identity Verification and Identity And Liveliness Verification at the same time.

        - International Identity Verification cannot be ordered without other international screenings.

        - Must choose between US criminal screenings or international criminal screenings.

        - Must include International Identity Verification if Canadian Criminal Record Check or International
        Criminal Record Check is included.


        #### OHS and drug screening restrictions


        - Cannot order more than one type of TB test.

        - Cannot order DOT and non-DOT drug screenings in the same order.

        - Cannot order more than one non-DOT drug screening.

        - Only one urine drug screening can be selected for any order.

        - Cannot order both vaccine and titer for the same immunization type. This applies for each of
        the following immunization types: Varicella, Hepatitis A, Hepatitis B, and MMR.

        - OSHA Respirator/Fit to Wear Questionnaire is required when Respirator/Mask Fit Testing - Qualitative
        or Respirator/Mask Fit Testing - Quantitative is being ordered.

        - OHS and drug screenings are US-only and cannot be ordered with Canadian or international screenings.'
      operationId: post-case-create
      parameters:
      - name: karmacheck-on-behalf-of
        in: header
        required: false
        description: Optional. The email address of the end user who initiated this request through your
          integration. Only applied when the request is authenticated with an API User token. When the
          email matches a KarmaCheck user with the appropriate access, that user is recorded as the creator
          of the case instead of the API User. See the endpoint description for full validation behavior.
        schema:
          type: string
          format: email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCase'
            examples:
              Candidate-provided PII flow:
                value:
                  packageId: a12ddee3-4fa5-43fc-9876-123a5d23a08b
                  email: matt.williams@example.com
                  givenName: Matt
                  familyName: Williams
              Customer-provided PII flow:
                value:
                  autoProcess: true
                  packageId: a12ddee3-4fa5-43fc-9876-123a5d23a08b
                  email: matt.williams@example.com
                  givenName: Matt
                  familyName: Williams
                  phone: '+18005550184'
                  candidateConsentProvided: true
                  candidateDisclosuresAndAuthorizationDocumentIds:
                  - 1234e9a3-8b78-4764-9fdd-12ce8c2b7f29
                  - b123427c-d3a1-4611-a4c3-7dc6e29b43aa
                  - ddde1e00-c1cd-4cb5-ade0-29ec1c3c4049
                  orderData:
                  - caseOrderDataTypeId: codt-govt-id
                    metadata:
                      govtId: 111-22-3333
                  - caseOrderDataTypeId: codt-dob
                    metadata:
                      dob: '1980-02-22'
                  - caseOrderDataTypeId: codt-current-candidate-address
                    metadata:
                      address1: 1 Main Street
                      city: New York
                      state: NY
                      postalCode: '10036'
                      country: US
                  orderConfig:
                    aliasNameConfiguration: alias-all+hits-only
                    serviceConfigs:
                      9ac65633-b4c4-4062-875c-3556db9d2a08:
                        verificationMethod: psv-first
                    contacts:
                    - email: defaultcontact@example.com
                      type: default
                      phone: 800-555-0170
                      name: Dana R.
                    - email: escalationcontact@example.com
                      type: escalation
                      name: Alex P.
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId:
                    type: string
                  caseInvitationId:
                    type: string
              examples:
                Example 1:
                  value:
                    caseId: a09215ff-f46c-49a6-9767-762da1f3afd2
                    caseInvitationId: a2831b9e-897c-4971-85fd-a8328443ed63
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: A case for the specified email already exists in the group that the case is being
            created under.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items:
                      type: object
                      required:
                      - existingCaseId
                      - existingCaseCrStamp
                      - existingCasePackageId
                      - existingCasePackageName
                      - existingCaseStatusId
                      - existingCaseStatus
                      - modStamp
                      properties:
                        existingCaseId:
                          type: string
                        existingCaseCrStamp:
                          type: string
                        existingCasePackageId:
                          type: string
                        existingCasePackageName:
                          type: string
                        existingCaseStatusId:
                          type: string
                        existingCaseStatus:
                          type: string
                        existingCaseSecondaryStatusId:
                          type: string
                        existingCaseSecondaryStatus:
                          type: string
                        modStamp:
                          type: string
                          description: If the existing case is complete, this is when it completed.
                          format: date-time
              examples:
                Example 1:
                  value:
                    cases:
                    - existingCaseId: 74e1c0da-3106-4efb-b293-0f1648afae50
                      existingCaseCrStamp: '2024-05-23T00:58:06.000+00:00'
                      existingCasePackageId: 7e32983c-1ea5-4271-9832-231a51c740be
                      existingCasePackageName: Basic Check
                      existingCaseStatusId: d894b8a0-937e-46b1-8799-15bad611844f
                      existingCaseStatus: Pending
                      existingCaseSecondaryStatusId: 8e0c9756-a42f-4a7d-b8e2-412a0f6b9dea
                      existingCaseSecondaryStatus: Waiting for Authorization
                      modStamp: '2024-05-23T00:58:06.000+00:00'
        '422':
          description: Bad data, or cannot replace an already completed case.
        '500':
          description: Internal Server Error
      security:
      - JWT: []
