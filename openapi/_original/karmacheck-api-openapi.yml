                    list:
                    - id: 681ab1fe-f862-4130-a6c1-1ca0e7b975bd
                      legalType: general-ca-disclosure
                      title: <div>Acknowledgment and Authorization for Background Check (general-ca)</div>
                      body: <div><p ><span>gen-cs-disc - Please be advised that KarmaCheck (the &quot;Company&quot;)
                        will procure one or more investigative consumer reports, as that term is defined
                        under California law, about you for employment purposes, including for decisions
                        regarding hiring, promotion, reassignment, or retention as an employee. Such reports
                        may include information on your character, general reputation, personal characteristics,
                        and mode of living.</span></p><p>The investigation will be conducted by KarmaCheck
                        Inc. and its associated partners or vendors. KarmaCheck, Inc., 595 Pacific Ave.
                        4th floor, San Francisco, CA 94133, (877) 732-2129, www.karmacheck.com</p><p>The
                        nature and scope of the report may include criminal history checks and other public
                        records, educational verification, employment verification, social media, and
                        motor vehicle records and the reports will be used for employment screening purposes.</p><br/><p><b>NOTICE
                        – BACKGROUND INVESTIGATION </b></p><p ><b><u>CALIFORNIA RESIDENTS</u></b></p><p
                        >This summary of the provisions of California Civil Code section 1786.22 is being
                        provided to you pursuant to state law. </p><p>Your employer intends to obtain
                        information about you from an investigative consumer reporting agency, as defined
                        under California law, for employment purposes.<b> </b></p><p>Under California
                        law you are entitled to visually inspect all files maintained about you by an
                        investigative consumer reporting agency (ICRA), such as KarmaCheck, Inc., upon
                        request and presentation of proper identification during normal business hours
                        and on reasonable notice as follows:</p><ul > <li ><b>In person</b>.  You may
                        request a copy of your file.  The ICRA may charge you for the actual copying costs
                        associated with providing you with a copy of your file.</li> <li ><b>By telephone</b>. 
                        A summary of all information contained in the ICRA’s file about you will be provided
                        to you via telephone, if you have made a written request for telephone disclosure,
                        and the toll charge, if any, for the telephone call is prepaid by or charged directly
                        to you.</li> <li ><b>By certified mail.</b>  You may make a written request for
                        copies to be sent to a specified addressee.  ICRA’s complying with requests for
                        certified mailings shall not be liable for disclosures to third parties caused
                        by mishandling of mail after such mailings leave the ICRA.</li></ul><p >&quot;Proper
                        Identification&quot; includes documents such as a valid driver’s license, social
                        security account number, military identification card, and credit cards.  If an
                        ICRA is unable to reasonably identify you on the basis of these documents, they
                        may require additional information concerning your employment and personal or
                        family history in order to verify your identity. </p><p >The ICRA will provide
                        trained personnel to explain any information furnished to you and will provide
                        a written explanation of any coded information contained in files maintained on
                        you.  This written explanation will be provided whenever a file is provided to
                        you for visual inspection. </p><p >You may be accompanied by one other person
                        of your choosing, who must furnish reasonable identification.  An ICRA may require
                        you to furnish a written statement granting permission to the ICRA to discuss
                        your file in such person’s presence.</p></div>
                      header: <div>Disclosure regarding background investigation and investigative consumer
                        reports as required by California law</div>
                      authorizationStatement: '<div><p><b><u><span>AUTHORIZATION FOR INVESTIGATIVE CONSUMER
                        REPORTS</span></u></b></p><p>By signing below, I hereby authorize the Company
                        to procure investigative consumer reports concerning me for employment purposes
                        at all times prior to my employment and, if I am hired/employed, throughout the
                        duration of my employment, as permitted by law and unless revoked by me in writing.</p><form><p><input
                        type=''checkbox'' readonly='''' ##SEND_REPORT## style=''-fs-checkbox-style: check;''
                        /><label>Check the box if you would like to receive a copy of the investigative
                        consumer report, free of charge, if one is obtained by the Company.</label></p><p>Signature</p><p><input
                        type=''text'' readonly='''' value=''##ELECTRONIC_SIGNATURE##''/></p></form></div>'
                      language: en
                      crStamp: '2020-01-04T14:39:30.000+00:00'
                      modStamp: '2024-02-26T19:53:16.000+00:00'
                      authorizationObject:
                        sections:
                        - title: AUTHORIZATION FOR INVESTIGATIVE CONSUMER REPORTS
                          selectionValue: signature
                          body: By signing below, I hereby authorize the Company to procure investigative
                            consumer reports concerning me for employment purposes at all times prior
                            to my employment and, if I am hired/employed, throughout the duration of my
                            employment, as permitted by law and unless revoked by me in writing.
                    - id: 42d3de15-ad5e-46d4-8af3-cf24581210db
                      legalType: state-city-all-disclosure
                      title: <div>Additional State Disclosures and Notices (state city all)</div>
                      body: '<div>    <p><b><span>state-city-all-disc - Minnesota: </span></b><span>If
                        you are a resident of Minnesota or applying for employment at a location within
                        the State of Minnesota, you have the right to submit a written request to KarmaCheck,
                        Inc. for a complete and accurate disclosure of the nature and scope of any consumer
                        report the Company ordered about you. KarmaCheck, Inc.  must provide you with
                        this disclosure within five business days after its receipt of your request or
                        the report was requested by the Company, whichever date is later.  </span></p>
                        <p><b><span>New Jersey: </span></b><span>If you are a New Jersey resident or applying
                        for employment at a location within the State of New Jersey, by signing below
                        you acknowledge receipt of the New Jersey Fair Credit Reporting Act provisions.</span></p>
                        <p><b><span>New York: </span></b><span>If you are a New York resident or applying
                        for employment at a location within the State of New York, by signing below you
                        acknowledge receipt of a copy of </span><a href="http://www.labor.ny.gov/formsdocs/wp/correction-law-article-23a.pdf"><span>Article
                        23-A</span></a><span> of the New York Correction Law. You have the right to inspect
                        and receive a copy of any investigative consumer report requested by the Company
                        by contacting KarmaCheck, Inc 877-732-2129.</span></p> <p><b><span>Vermont</span></b><span>:
                        If you are a Vermont resident or applying for employment at a location within
                        the State of Vermont, by signing below you acknowledge receipt of the NOTICE –
                        BACKGROUND INVESTIGATION AND USE OF CREDIT INFORMATION.</span></p> <p><b><span>Washington
                        State</span></b><span>:  If you are a Washington resident or applying for employment
                        at a location within the State of Washington, you have the right to request from
                        KarmaCheck, Inc. a written summary of your rights and remedies under the Washington
                        Fair Credit Reporting Act.</span></p><p><b><span>Massachusetts and Oklahoma: 
                        </span></b><span>If you are a resident of Massachusetts or Oklahoma or applying
                        for employment in one of these states, please check the box in the Disclosure
                        and Acknowledgement peeiouv to this if you would like to receive a copy of your
                        consumer report, free of charge, if one is obtained by the Company. </span></p>    <br/>    <p><b><u>NEW
                        JERSEY RESIDENTS</u></b></p>    <p><b>New Jersey Residents or Employees</b> –
                        this summary of the provisions of the New Jersey Fair Credit Reporting Act (“NJFCRA”)
                        is being provided to you pursuant to state law (N.J.S.A. § 56:11-28 et seq.) </p>    <p>Before
                        an employer can obtain a consumer report about you from a consumer reporting agency
                        they must provide you with a clear and conspicuous disclosure in writing that
                        such may be obtained for employment purposes.  You must provide written consent
                        to the procurement, for employment purposes, of a consumer report.</p>    <p>When
                        using a consumer report for employment purposes, before taking adverse action
                        based in whole or in part on the report, an employer must provide you with a copy
                        of the consumer report and a description in writing of your rights under the federal
                        Fair Credit Reporting Act as well as the NJFCRA.</p>    <p>You must be afforded
                        a reasonable opportunity to dispute, with the consumer reporting agency, any information
                        on which the employer relied upon in your consumer report.</p>    <p>You can request
                        from a consumer reporting agency all information in your file, upon proper identification. 
                        This includes sources of information and identification of each person who procured
                        a consumer report for employment purposes during the two-year period preceding
                        your request. These requests must be made during normal business hours and on
                        reasonable notice. It can be done in person or by telephone, if you have made
                        a written request and pay the toll charge. A consumer reporting agency must provide
                        trained personnel to explain to you any information in the consumer report.</p>    <p>You
                        can dispute inaccurate information with the consumer reporting agency. If you
                        dispute the completeness or accuracy of any of the information in your file, the
                        consumer reporting agency must reinvestigate free of charge during a 30-day period.
                        A consumer reporting agency must provide written notice to you of the results
                        of the reinvestigation not later than five business days after completion of the
                        reinvestigation.</p>    <p>If, after a reinvestigation, any information disputed
                        by you is found to be inaccurate or incomplete or cannot be verified, the consumer
                        reporting agency must promptly delete that item of information from your file
                        or modify that item of information, as appropriate, based on the results of the
                        reinvestigation.</p>    <p> &#160; &#160; &#160; &#160; &#160;You can seek damages
                        for noncompliance under the NJFCRA.</p>    <br/>    <p><b><u>NEW YORK RESIDENTS</u></b></p>    <p><b>New
                        York Residents or Employees</b> – this summary of the provisions of the New York
                        Correction Law is being provided to you pursuant to state law. </p>    <p><b>Article
                        23-A</b></p>    <p><b>Licensure and Employment of Persons Previously </b></p>    <p><b>Convicted
                        of One or More Criminal Offenses</b></p>    <p><b>§ 750. Definitions</b></p>    <p>For
                        the purposes of this article, the following terms shall have the following meanings:</p>    <p>(1)
                        “Public agency” means the state or any local subdivision thereof, or any state
                        or local department, agency, board or commission.</p>    <p>(2) “Private employer”
                        means any person, company, corporation, labor organization or association which
                        employs ten or more persons.</p>    <p>(3) “Direct relationship” means that the
                        nature of criminal conduct for which the person was convicted has a direct bearing
                        on his fitness or ability to perform one or more of the duties or responsibilities
                        necessarily related to the license, opportunity, or job in question.</p>    <p>(4)
                        “License” means any certificate, license, permit or grant of permission required
                        by the laws of this state, its political subdivisions or instrumentalities as
                        a condition for the lawful practice of any occupation, employment, trade, vocation,
                        business, or profession. Provided, however, that “license” shall not, for the
                        purposes of this article, include any license or permit to own, possess, carry,
                        or fire any explosive, pistol, handgun, rifle, shotgun, or other firearm.</p>    <p>(5)
                        “Employment” means any occupation, vocation or employment, or any form of vocational
                        or educational training. Provided, however, that “employment” shall not, for the
                        purposes of this article, include membership in any law enforcement agency.</p>    <p><b>§
                        751. Applicability </b></p>    <p>The provisions of this article shall apply to
                        any application by any person for a license or employment at any public or private
                        employer, who has previously been convicted of one or more criminal offenses in
                        this state or in any other jurisdiction, and to any license or employment held
                        by any person whose conviction of one or more criminal offenses in this state
                        or in any other jurisdiction preceded such employment or granting of a license,
                        except where a mandatory forfeiture, disability or bar to employment is imposed
                        by law, and has not been removed by an executive pardon, certificate of relief
                        from disabilities or certificate of good conduct. Nothing in this article shall
                        be construed to affect any right an employer may have with respect to an intentional
                        misrepresentation in connection with an application for employment made by a prospective
                        employee or previously made by a current employee.</p>    <p><b>§ 752. Unfair
                        discrimination against persons previously convicted of one or more criminal offenses
                        prohibited</b></p>    <p>No application for any license or employment, and no
                        employment or license held by an individual, to which the provisions of this article
                        are applicable, shall be denied or acted upon adversely by reason of the individual&#39;s
                        having been previously convicted of one or more criminal offenses, or by reason
                        of a finding of lack of “good moral character” when such finding is based upon
                        the fact that the individual has previously been convicted of one or more criminal
                        offenses, unless:</p>    <p>(1) there is a direct relationship between one or
                        more of the previous criminal offenses and the specific license or employment
                        sought or held by the individual; or</p>    <p>(2) the issuance or continuation
                        of the license or the granting or continuation of the employment would involve
                        an unreasonable risk to property or to the safety or welfare of specific individuals
                        or the general public.</p>    <p><b>§ 753. Factors to be considered concerning
                        a previous criminal conviction; presumption</b></p>    <p>1. In making a determination
                        pursuant to section seven hundred fifty-two of this chapter, the public agency
                        or private employer shall consider the following factors:</p>    <p>(a) The public
                        policy of this state, as expressed in this act, to encourage the licensure and
                        employment of persons previously convicted of one or more criminal offenses.</p>    <p>(b)
                        The specific duties and responsibilities necessarily related to the license or
                        employment sought or held by the person.</p>    <p>(c) The bearing, if any, the
                        criminal offense or offenses for which the person was previously convicted will
                        have on his fitness or ability to perform one or more such duties or responsibilities.</p>    <p>(d)
                        The time which has elapsed since the occurrence of the criminal offense or offenses.</p>    <p>(e)
                        The age of the person at the time of occurrence of the criminal offense or offenses.</p>    <p>(f)
                        The seriousness of the offense or offenses.</p>    <p>(g) Any information produced
                        by the person, or produced on his behalf, in regard to his rehabilitation and
                        good conduct.</p>    <p>(h) The legitimate interest of the public agency or private
                        employer in protecting property, and the safety and welfare of specific individuals
                        or the general public.</p>    <p>2. In making a determination pursuant to section
                        seven hundred fifty-two of this chapter, the public agency or private employer
                        shall also give consideration to a certificate of relief from disabilities or
                        a certificate of good conduct issued to the applicant, which certificate shall
                        create a presumption of rehabilitation in regard to the offense or offenses specified
                        therein.</p>    <p><b>§ 754. Written statement upon denial of license or employment</b></p>    <p>At
                        the request of any person previously convicted of one or more criminal offenses
                        who has been denied a license or employment, a public agency or private employer
                        shall provide, within thirty days of a request, a written statement setting forth
                        the reasons for such denial.</p>    <p><b>§<i> </i>755. Enforcement</b></p>    <p>1.
                        In relation to actions by public agencies, the provisions of this article shall
                        be enforceable by a proceeding brought pursuant to article seventy-eight of the
                        civil practice law and rules.</p>    <p>2. In relation to actions by private employers,
                        the provisions of this article shall be enforceable by the division of human rights
                        pursuant to the powers and procedures set forth in article fifteen of the executive
                        law, and, concurrently, by the New York city commission on human rights.</p><br/><p><b><u>WASHINGTON
                        D.C. RESIDENTS</u></b></p><p>The District of Columbia Fair Criminal Record Screening
                        Amendment Act of 2014 only allows businesses to withdraw a conditional job offer
                        or take an adverse action because of an applicant&#39;s criminal conviction(s)
                        for a legitimate business reason. Your conditional job offer was revoked based
                        on a review of your past criminal conviction(s). This decision must be considered
                        reasonable in light of six factors.*</p><p>If you believe your job offer was improperly
                        revoked based on the employer&#39;s review of your criminal conviction, you have
                        the right to:</p><ul><li>Within 30 days of the action, request from the employer
                        a copy of all records related to the consideration of your application, including
                        your criminal record. The file must then be provided to you within 30 days of
                        your request.</li><li>File a complaint with the District of Columbia Office of
                        Human Rights (OHR). It is cost free and does not require an attorney. OHR will
                        review the facts related to the business&#39; decision, and may initiate a mediation
                        and investigation.</li></ul><p>Complaints must be filed with OHR within one year
                        of the adverse action, and can be filed online at ohr.dc.gov/page/complaints,
                        or at 441 4th Street NW, Suite 570N, Washington,DC, 20010.</p><p>Penalties can
                        be imposed against the business if a violation is found, with half the penalty
                        being awarded to you as the applicant and the other half to the District of Columbia
                        government.</p><p>For more information about your rights under the Fair Criminal
                        Record Screening Amendment Act or about the complaint process at OHR, visit ohr.dc.gov/page/returning
                        citizens or call 202.727.4559.</p><p><span>* <i>The employer&#39;s legitimate
                        business reason must be reasonable in light of the following factors: A reasonable
                        business purpose must be determined using six factors:</i> (1) Specific duties
                        and responsibilities necessarily related to the employment; (2)Fitness or ability
                        to perform one or more job duties or responsibilities given the offense; (3) Time
                        elapsed since the offense;(4) Age of the applicant when the offense occurred;
                        (5) Frequency and seriousness of the offense; and (6) Any information about the
                        applicant that indicates rehabilitation or good conduct since the offense occurred.</span></p><br/>    <p><b><u>WASHINGTON
                        STATE RESIDENTS </u></b></p>    <p><b>Washington State Residents or Employees</b>
                        – this summary of the provisions of the Washington State Fair Credit Reporting
                        Act (WFCRA) is being provided to you pursuant to state law.  The WFCRA is designed
                        to promote accuracy, fairness, consumer confidentiality and the proper use of
                        credit data by each consumer reporting agency (CRA) in accordance with the requirements
                        of the WFCRA.</p>    <p>The WFCRA is modeled after, and generally provides the
                        same rights as, the federal Fair Credit Reporting Act (FCRA) (15 U.S.C. § 1681
                        <i>et seq.</i>)  A summary of your rights under the FCRA is available at <a href="http://files.consumerfinance.gov/f/201504_cfpb_summary_your-rights-under-fcra.pdf">http://files.consumerfinance.gov/f/201504_cfpb_summary_your-rights-under-fcra.pdf</a>.</p>    <p>The
                        complete text of the WFCRA RCW 19.182, can be obtained from the:</p>    <div>        <span>Washington
                        Code Revisers Office</span><br/>        <span>P.O. &#160;Box &#160;40551</span><br/>        <span>Olympia,
                        &#160;WA &#160;98504</span><br/>    </div>    <p>Online &#160;at &#160;<a href="http://apps.leg.wa.gov/rcw/default.aspx?cite=19.182&amp;full=true%20-%2019.182.070">http://apps.leg.wa.gov/rcw/default.aspx?cite=19.182&amp;full=true%20-%2019.182.070</a>. 
                        </p>    <p>One significant distinction between the FCRA and the WFCRA is that
                        in Washington, an employer may not obtain a consumer report that indicates the
                        consumer&#39;s credit worthiness, credit standing, or credit capacity, unless
                        (1) the information is substantially job related and the employer&#39;s reason(s)
                        for using the information are disclosed in writing, or (2) the information is
                        required by law.</p>    <p>The following is a summary of your major rights under
                        the WFCRA: </p>    <ul>        <li><b>You will be required to provide proper identification
                        before reviewing your consumer file.</b>Proper identification may include your
                        Social Security number. You may request to review your file at any time. A CRA
                        will make disclosures of your file  available to you during normal business hours
                        and on reasonable notice. File disclosures may be done in person or by telephone,
                        if you have made a written request and pay the toll charge, as applicable, or
                        by any other reasonable means. A CRA will provide trained personnel to explain
                        to you any information in your consumer report. Upon request, and proper identification,
                        you may be permitted to bring one additional person with you to review your consumer
                        file. If the CRA provides you with a credit score, the agency will also provide
                        you with an explanation for that credit score.</li>        <li><b>You have a right
                        to know what is in your file. </b>Upon proper identification,<b> </b>you may request
                        and obtain all the information about you in the CRA&#39;s files, although medical
                        information may be withheld, and instead will be disclosed to a health care provider
                        of your choice. Your health care provider may disclose your medical information
                        to you directly. Your file disclosure will include all items of information the
                        CRA maintains about you, including sources of information (except sources acquired
                        solely for      use in an investigative report). The file will also identify each
                        person who procured your consumer report for employment purposes during the two-year
                        period preceding your request, or any person who procured your report for any
                        other purpose within the six-months prior to your request.  When applicable, a
                        record of inquiries the CRA received identifying you in a credit transaction that
                        was not initiated by you in the six-months prior to your file disclosure request. 
                        Each of these records will include the name of the person or trade name of the
                        business that sought your consumer file, and upon your request, their respective
                        addresses.</li>        <li><b>You are entitled to one free consumer report every
                        12 months, upon request.</b> In many cases, your file disclosure will be free.
                        You may be charged a limited fee for a second or subsequent report requested by
                        you during a 12 month period. You will also not be charged for:</li>        <ul>            <li>a
                        consumer report if a person has taken adverse action against you because of information
                        in your report;</li>            <li>the reinvestigation of information you dispute;
                        or</li>            <li>corrected reports resulting from the deletion of inaccurate
                        or unverifiable information.</li>        </ul>        <li><b>You must be told
                        if information in your file has been used against you. </b>If a person takes an
                        adverse action against you that is based, in whole or in part, on information
                        contained in a consumer report, that person must tell you (usually, through a
                        written notice), and must give you the name, address, and telephone number of
                        the CRA that provided the information.</li>    </ul>    <ul>        <li><b>You
                        have a right to dispute incomplete or inaccurate information. </b>If you identify
                        information in your file that is incomplete or inaccurate, and you notify the
                        CRA directly of the dispute, the CRA will reinvestigate without charge and record
                        the current status of the disputed information before the end of thirty business
                        days, unless your dispute is frivolous.  Upon completion of the reinvestigation,
                        within five business days of the CRA&#39;s decision, the agency will provide you
                        notice in writing or through another authorized means, of the results of the reinvestigation. 
                        If the CRA determines that your dispute is frivolous the agency will inform you
                        of that determination, along with its reasons, and your rights under the WFCRA
                        within five business days.</li>        <li><b>Consumer reporting agencies must
                        correct or delete inaccurate, incomplete, or unverifiable information. </b>Upon
                        completion of the reinvestigation, if the information you disputed is found to
                        be inaccurate or cannot be verified, the CRA must delete the information and notify
                        you of the correction. Information that has been found to be inaccurate will not
                        be reinserted into your consumer file, unless the furnisher of the information
                        verifies the accuracy and completeness of that information.  In such circumstances,
                        you will be notified, within thirty business days that the information is being
                        reinserted into your file.  If the reinvestigation does not resolve your dispute,
                        you may file with the CRA a brief statement (that may be limited to 100 words)
                        setting forth the nature of your dispute. The statement will be placed in your
                        consumer file and in any subsequent report containing the information you disputed.</li>        <li><b>You
                        have the right to request that users of your consumer report be notified of any
                        disputed information they previously received within the statutory time frame. 
                        </b>After certain disputed information has been deleted or you have filed a statement
                        of dispute, you may request that the CRA provides notification of that deleted
                        item or item of dispute to any person you designate who has, within two years
                        received your consumer report for employment purposes, or who has within six months
                        received your report for any other purpose, if the furnished report contained
                        the deleted or disputed information.</li>        <li><b>Consumer reporting agencies
                        may not report outdated negative information. </b>In most cases, a CRA may not
                        report negative information that is more than seven years old, or bankruptcies
                        that are more than ten years old.</li>        <li><b>You have the right to advanced
                        disclosure of any fees.</b>  Any charges for file disclosures or other requested
                        actions to be taken by the CRA must be disclosed to you before the information
                        is provided or the action is taken.</li>        <li><b>Access to your file is
                        limited. </b>A CRA may provide information about you only to people with a valid
                        need – usually to consider an application with a creditor, insurer, employer,
                        landlord, court or government agency, or in accordance with your written instructions.
                        </li>        <li><b>You must be notified if reports are provided to employers.
                        </b>A CRA may not give out information about you to employers without your knowledge.
                        A potential employer must make a clear and conspicuous disclosure in writing to
                        you or obtain your consent before obtaining a report. A current employer may not
                        receive a report unless it has given you written notice that reports may be used
                        for employment purposes.</li>        <li><b>You must be notified in writing if
                        a person seeks an investigative consumer report about you. </b>An investigative
                        consumer report may include information as to your character, general reputation,
                        personal characteristics, and mode of living.  Within a reasonable period of time
                        after receiving such notice, you may request, in writing, a disclosure as to the
                        nature and scope of the investigation requested—which will be delivered to you
                        within five days of your request.</li>        <li><b>You may limit “prescreened”
                        offers of credit and insurance you get based on information in your credit report.
                        </b>You may elect not to receive unsolicited “prescreened” offers for credit and
                        insurance by using the CRA&#39;s notification system to remove your name and address
                        from the lists these offers are based on. You may opt-out with the nationwide
                        credit bureaus at 1-888-5-OPTOUT (1-888-567-8688).</li>        <li><b>You may
                        place a security freeze on your credit report. </b>Under certain circumstances,
                        you may request that a security freeze be placed on your credit report to prevent
                        it from being shared with potential creditors or insurance companies when making
                        determinations related to your eligibility for credit. </li>        <li><b>You
                        may be able to block information resulting from identity theft from appearing
                        on your credit report. </b>If you are a victim of identity theft, certain CRAs
                        must permanently block misinformation resulting from that theft from appearing
                        on your credit report. You must provide the CRA with a copy of a police report
                        as evidence of your claim before it can place the block on your report.</li>        <li><b>You
                        may seek damages from violators. </b>If a CRA, a user of consumer reports, or
                        a furnisher of information to a CRA violates the WFCRA, and you have a legal basis
                        for a claim under the WFCRA, you may be able to bring a legal action in court
                        to assert your rights under the WFCRA.  The applicable statute of limitations
                        is specified in Wash. Stat. § &#160;19.182.120 —which is generally two years from
                        the date the cause of action accrued.  Consumers who prevail on claims to enforce
                        the WCFRA may obtain actual damages, monetary penalties, reasonable attorneys&#39;
                        fees, costs, and other relief.</li>    </ul>    <p><u>For questions or concerns
                        regarding the WFCRA, please contact</u>:</p>    <div>    <span>Office of the Attorney
                        General</span><br/>    <span>Consumer Protection Division</span><br/>    <span>800
                        5th Avenue, Suite 2000</span><br/>    <span>Seattle, Washington 98104-3188</span><br/>    <span>Phone
                        1-800-551-4636 or (206) 464-6684</span><br/>    <span>Statewide Toll-Free TDD:
                        800-833-6388</span>    </div>    <p><u>Any complaints by consumers under state
                        law may be directed to</u>:</p>    <p>The Attorney General&#39;s Office via U.S.
                        Mail or Online.  </p>    <p>Information and forms related to filing a consumer
                        complaint can be found at:</p>    <p><a href="http://www.atg.wa.gov/FileAComplaint.aspx">http://www.atg.wa.gov/FileAComplaint.aspx</a></p>    <p>Additional
                        information about consumer issues can be found at: </p>    <p><a href="http://www.atg.wa.gov/consumer-issues">http://www.atg.wa.gov/consumer-issues</a></p>    <br/>    <hr/>    <p><b><u>SAN
                        FRANCISCO, CALIFORNIA NOTICE IN ENGLISH:</u></b></p>    <p><b><span>CITY AND COUNTY
                        OF SAN FRANCISCO EDWIN M. LEE, MAYOR</span></b></p>    <h3><span>NOTICE TO JOB
                        APPLICANTS AND EMPLOYEES</span></h3>    <h4><span>San Francisco Fair Chance Ordinance
                        Police Code, Article 49</span></h4>    <p><b><span>Starting August 13, 2014, the
                        Fair Chance Ordinance (San Francisco Police Code, Article 49) requires employers
                        to follow strict rules regarding the use of arrest and conviction records in hiring
                        and employment decisions.</span></b><span> The ordinance covers job applicants
                        and employees who would be or are performing work in whole, or in substantial
                        part, in San Francisco and applies to employers who have 20 or more employees
                        (regardless of the employees&#39; locations).</span></p>    <p><b><span>Certain
                        matters are off-limits.</span></b><span > An employer may </span><i><span>never</span></i><span>
                        ask about, require disclosure of, or consider: an arrest not leading to a conviction
                        (other than an unresolved arrest that is still undergoing criminal investigation
                        or trial); participation in a diversion or deferral of judgment program; a conviction
                        that has been expunged or made inoperative; any determination in the juvenile
                        justice system; a conviction more than 7 years old; and a criminal offense other
                        than a felony/misdemeanor. Matters that are off-limits cannot be used by the employer
                        for any reason at any stage of the hiring process.</span></p>    <p><b><span>An
                        employer cannot ask about an individual&#39;s conviction history or unresolved
                        arrests at the start of the hiring process.</span></b><span> This includes through
                        a job application form, informal conversation, or otherwise.</span></p>    <p><b><span>A
                        mandatory interactive process for matters not off-limits.</span></b><span> Only
                        after a live interview has been conducted, or a conditional offer of employment
                        made, is the employer allowed to ask about an individual&#39;s conviction history
                        (except as to matters that are off-limits) and unresolved arrests. Only those
                        convictions and unresolved arrests that </span><i><span>directly relate</span></i><span>
                        to the individual&#39;s ability to do the job may be considered in making an employment
                        decision.</span></p>    <p><span>Before the employer may take an adverse action
                        such as failing/refusing to hire, discharging, or not promoting an individual
                        based on a conviction history or unresolved arrest, the employer must give the
                        individual an opportunity to present evidence that the information is inaccurate,
                        the individual has been rehabilitated, or other mitigating factors. The individual
                        has seven days to respond, at which point the employer must delay any adverse
                        action for a reasonable time and reconsider the adverse action. The employer must
                        notify the individual of any final adverse action.</span></p>    <p><i><span>Evidence
                        of rehabilitation</span></i><span> include satisfying parole/probation; receiving
                        education/training; participating in alcohol/drug treatment programs; letters
                        of recommendation; and age at which the individual was convicted. </span><i><span
                        >Mitigating factors</span></i><span >include coercion, physical or emotional abuse,
                        and untreated substance abuse/mental illness, that contributed to the conviction.</span></p>    <p><b><span
                        >No Retaliation.</span></b><span > An employer may not take an adverse action
                        against an applicant or employee for exercising their rights under the ordinance
                        or cooperating with the Office of Labor Standards Enforcement OLSE.</span></p>    <p><span>If
                        you need more information, or wish to report an employer that you believe has
                        violated this ordinance, please contact the OLSE at 415-554-5192 or email </span><a
                        href="mailto:FCE@sfgov.org"><span>FCE@sfgov.org</span></a><span >.</span><br/>    <b><span>OFFICE
                        OF LABOR STANDARDS ENFORCEMENT</span></b><br/>    <b><span>City Hall, Room 430
                        1 Dr. Carlton B. Goodlett Place San Francisco CA 94102-4685 Tel. (415) 554-6235
                        Fax (415) 554-4791.</span></b></p>    <p><b><span> &#160;</span></b></p>    <p><b><u>SAN
                        FRANCISCO, CALIFORNIA NOTICE IN SPANISH:</u></b></p>    <p><span><b>CIUDAD Y CONDADO
                        DE SAN FRANCISCO EDWIN M. LEE, ALCALDE</b></span></p>    <h3><span>AVISO PARA
                        LOS SOLICITANTES DE EMPLEO Y EMPLEADOS</span></h3>    <h4><span>Ordenanza de Oportunidades
                        Equitativas de San Francisco Código de Policía, Artículo 49</span></h4>    <p><b><span>A
                        partir del 13 de agosto de 2014, la Ordenanza de Oportunidades Equitativas (Código
                        Policiaco de San Francisco, Artículo 49) requiere que los empleadores sigan reglas
                        estrictas referentes al uso de los expedientes de arrestos y condenas al tomar
                        decisiones de contratación y empleo.</span></b><span> La ordenanza cubre a los
                        solicitantes de empleos y empleados que estarían o están realizando su trabajo,
                        o una parte sustancial del mismo, en San Francisco y se aplica a los empleadores
                        que tengan 20 o más empleados (sin importar la ubicación de los empleados).</span></p>    <p><b><span>Está
                        prohibido tocar ciertos asuntos.</span></b><span> Un empleador nunca puede preguntar,
                        requerir la divulgación de, o considerar: un arresto que no haya resultado en
                        una condena (que no sea un arresto no resuelto que actualmente esté bajo investigación
                        penal o juicio); participación en un programa de justicia alternativa o de fallo
                        diferido; una condena que haya sido cancelada o declarada inoperante; cualquier
                        determinación en el sistema de justicia juvenil; una condena de más de 7 años
                        de antigüedad; y una infracción penal que no sea un delito mayor o delito menor.
                        El empleador no puede utilizar los asuntos que están prohibidos para ningún propósito,
                        en ninguna etapa del proceso de contratación.</span></p>    <p><b><span>Un empleador
                        no puede preguntar sobre el historial de condenas o de arrestos no resueltos de
                        una persona al inicio del proceso de contratación.</span></b><span> Esto incluye
                        preguntar mediante un formulario de solicitud de empleo, una conversación informal
                        o de otra forma.</span></p>    <p><b><span>Un proceso interactivo obligatorio
                        para asuntos que no estén prohibidos.</span></b><span> Sólo después de que se
                        haya hecho una entrevista en persona, o se haya hecho una oferta condicional de
                        empleo, el empleador tiene permitido hacer preguntas sobre el historial de condenas
                        de una persona (excepto sobre asuntos que estén prohibidos) y arrestos no resueltos.
                        Sólo se pueden tomar en cuenta las condenas y los arrestos no resueltos que directamente
                        se relacionen con la capacidad de la persona para hacer el trabajo al tomar la
                        decisión del empleo.</span></p>    <p><span>Antes de que el empleador pueda tomar
                        una acción adversa como no contratar, negarse a contratar, despedir, o no dar
                        un ascenso a una persona con base en su historial de condenas o arrestos no resueltos,
                        debe darle a la persona una oportunidad para presentar evidencia de que la información
                        no es precisa, que la persona está rehabilitada, y otros factores atenuantes.
                        La persona tiene 7 días para responder, en cuyo momento, el empleador debe posponer
                        cualquier acción adversa durante un tiempo razonable y reconsiderar la acción
                        adversa. El empleador debe avisar al individuo sobre cualquier acción adversa
                        final.</span></p>    <p><span>La evidencia de rehabilitación incluye una libertad
                        probatoria/bajo palabra satisfactoria; recibir educación/capacitación; participación
                        en programas de tratamiento contra alcohol/drogas; cartas de recomendación; y
                        la edad a la que la persona recibió la condena. Los factores atenuantes incluyen
                        el chantaje, el maltrato físico o emocional, y la enfermedad no tratada mental
                        o de consumo de sustancias que hayan contribuido con la condena.</span></p>    <p><b><span>Sin
                        represalias.</span></b><span> Un empleador no puede tomar una acción adversa contra
                        un solicitante o empleado por ejercer sus derechos conforme a la ordenanza o por
                        cooperar con la Oficina de Cumplimiento de los Estándares Laborales (Office of
                        Labor Standards Enforcement, OLSE).</span></p>    <p><span>Si usted necesita más
                        información, o si desea reportar a un empleador que usted crea que ha infringido
                        esta ordenanza, por favor comuníquese con la OLSE al 415-554-5192 o por correo
                        electrónico a </span><a href="mailto:FCE@sfgov.org"><span>FCE@sfgov.org</span></a><span>.</span><br/>    <b><span>OFFICE
                        OF LABOR STANDARDS ENFORCEMENT</span></b><br/>    <b><span>City Hall, Room 430
                        1 Dr. Carlton B. Goodlett Place San Francisco CA 94102-4685 Tel. (415) 554-6235
                        Fax (415) 554-4791.</span></b></p>    <p><b><span> &#160;</span></b></p>    <p><b><u>SAN
                        FRANCISCO, CALIFORNIA NOTICE IN TAGALOG:</u></b></p>    <p><b><span>LUNGSOD AT
                        COUNTY NG SAN FRANCISCO EDWIN M. LEE, MAYOR</span></b></p>    <h3><span>PASABI
                        SA MGA APLIKANTE NG TRABAHO AT MGA KAWANI</span></h3>    <h4><span>Ordinansa ng
                        Makatarungang Pagkakataon ng San Francisco (San Francisco Fair Chance Ordinance)
                        Police Code, Article 49</span></h4>    <p><b><span>Simula ng Agosto 13, 2014,
                        ang Ordinansa ng Makatarungang Pagkakataon (Fair Chance Ordinance) (San Francisco
                        Police Code, Article 49) ay nag-uutos sa mga may-ari ng negosyo na mahigpit na
                        sundin ang mga alituntunin tungkol sa paggamit ng mga talaan sa pagdakip at paghatol
                        ng pagkakasala sa mga desisyon sa pagtanggap ng kawani at pagtatrabaho.</span></b><span>
                        Ang ordinansa ay sumasakop sa mga aplikante ng trabaho at mga kawani na magtatrabaho
                        o nagtatrabaho sa kabuuan, o sa mahalagang bahagi, sa San Francisco at umiiral
                        sa mga may-ari ng negosyo na may 20 o higit pang kawani (sa kabila ng mga lugar
                        na kinaroroonan ng mga kawani).</span></p>    <p><b><span>Ang ilang mga bagay
                        ay pinagbabawal.</span></b><span> Ang may-ari ng negosyo ay </span><i><span>hindi
                        kailanman</span></i><span> maaaring magtanong, mangailangan ng pagbubunyag, o
                        isaalang-alang ang tungkol sa: pagdakip na hindi nagresulta sa paghatol ng pagkakasala
                        (maliban sa hindi pa nalulutas na pagdakip na sumasailalim pa ng kriminal na imbestigasyon
                        o paglilitis); paglahok sa programa ng isang paglihis o pagliban ng paghatol;
                        paghatol ng pagkakasala na binura o hindi ipinatupad; anumang pagpapasiya sa sistema
                        ng katarungang pangkabataan; paghatol ng pagkakasala na mahigit sa 7 taon; at
                        kriminal na pagkakasala maliban sa krimen/maliit na kasalanan. Ang mga bagay na
                        pinagbabawal ay hindi maaaring gamitin ng employer para sa anumang dahilan at
                        anumang bahagi ng proseso ng pagtanggap ng kawani.</span></p>    <p><b><span>Ang
                        may-ari ng negosyo ay hindi maaaring magtanong sa indibiduwal tungkol sa kasaysayan
                        ng paghatol ng pagkakasala o hindi pa nalulutas na mga pagdakip sa simula ng proseso
                        ng pagtanggap ng kawani.</span></b><span> Kabilang dito ang paggamit sa pormularyo
                        ng aplikasyon sa trabaho, hindi pormal na pakikipag-usap, o ng iba pang paraan.</span></p>    <p><b><span>Ang
                        inuutos na interaktibong proseso para sa mga bagay na hindi pinagbabawal.</span></b><span>
                        Pagkatapos lamang na magsagawa ng personal na panayam, o magbigay ng may-kondisyong
                        alok ng pagtatrabaho, ang employer ay pinapahintulutang magtanong sa indibiduwal
                        tungkol sa kasaysayan ng paghatol ng pagkakasala (maliban sa mga bagay na pinagbabawal)
                        at hindi pa nalulutas na mga pagdakip. Iyon lamang mga paghatol ng pagkakasala
                        at hindi pa nalulutas na mga pagdakip na </span><i><span>tuwirang may-kaugnayan</span></i><span>
                        sa kakayahan ng indibiduwal na gawin ang trabaho ang maaaring isaalang-alang sa
                        paggawa ng desisyon sa pagtatrabaho.</span></p>    <p><span>Bago maaaring gumawa
                        ng kasalungat na aksiyon ang employer gaya ng pagbagsak/pagtangging tanggapin
                        sa trabaho, pagpapaalis, o hindi pagtataas ng tungkulin ng indibiduwal batay sa
                        kasaysayan ng paghatol ng pagkakasala o hindi pa nalulutas na pagdakip, ang employer
                        ay dapat bigyan ng pagkakataon ang indibiduwal na magharap ng ebidensiya na ang
                        impormasyon ay hindi wasto, na ang indibiduwal ay dumaan na sa rehabilitasyon,
                        o iba pang nakakababang mga dahilan. Ang indibiduwal ay may pitong araw upang
                        tumugon, na kung saan ang employer ay dapat ipagpaliban ang anumang kasalungat
                        na aksiyon sa loob ng makatwirang panahon at muling isaalang-alang ang kasalungat
                        na aksiyon. Ang employer ay dapat ipabatid sa indibiduwal ang anumang panghuling
                        kasalungat na aksiyon.</span></p>    <p><span>Kabilang sa </span><i><span>ebidensiya
                        ng rehabilitasyon</span></i><span> ay ang kasiya-siyang parol/pansamantalang pagpapalaya
                        (probation); pagtanggap ng edukasyon/pagsasanay; paglahok sa mga programa ng paggamot
                        ng alkohol/druga; mga sulat ng rekomendasyon; at edad nang nahatulan ang indibiduwal.
                        Kabilang sa </span><i><span>nakakababang mga dahilan</span></i><span> ay pananakot,
                        pisikal o emosyonal na pag-abuso, at hindi pa nagagamot na pag-abuso sa substansiya/sakit
                        pangkaisipan, na naging dahilan sa paghatol ng pagkakasala.</span></p>    <p><b><span>Walang
                        Pagganti. </span></b><span>Ang may-ari ng negosyo ay hindi maaaring gumawa ng
                        kasalungat na aksiyon laban sa aplikante o kawani dahil sa pagganap ng kanilang
                        mga karapatan sa ilalim ng ordinansa o pakikipag-tulungan sa Office of Labor Standards
                        Enforcement (OLSE).</span></p>    <p><span>Kung kailangan pa ninyo ng higit na
                        impormasyon, o nais mag-ulat ng employer na sa palagay ninyo ay lumabag sa ordinansang
                        ito, mangyaring kontakin ang OLSE sa 415-554-5192 o email </span><a href="mailto:FCE@sfgov.org"><span>FCE@sfgov.org</span></a><span>.</span><br/>        <b><span>OFFICE
                        OF LABOR STANDARDS ENFORCEMENT</span></b><br/>        <b><span>City Hall, Room
                        430 1 Dr. Carlton B. Goodlett Place San Francisco CA 94102-4685 Tel. (415) 554-6235
                        Fax (415) 554-4791.</span></b></p>    <p><b><u>SAN FRANCISCO, CALIFORNIA NOTICE
                        IN CHINESE:</u></b></p>    <p><span class="cjk">三藩市縣<br/>市長李孟賢<br/><u>求職者和雇員通告</u><br/>三藩市公平機會條例<br/>《警察法規》第49條</span></p>    <p><span
                        class="cjk">2014年8月13日起，《公平機會條例》（《三藩市員警法規》第49條》）要求雇主做出招聘和雇用決定時嚴格遵守使用被捕和犯罪記錄相關的規定。。</span><span
                        class="cjk">本條例適用於將來或目前大部分時間在三藩市工作的求職者和雇員並適用於有20名或以上雇員的雇主（不考慮雇員的所在地）。</span></p>    <p><span
                        class="cjk">某些事項受到禁止。</span><span class="cjk">雇主任何時候不得問及、要求披露或者考慮求職者或雇員相關的以下事項：（1）未導致定罪的逮捕（仍在進行刑事調查或審理的除外）；（2）參與判決程序轉移或延期；（3）被刪除或宣告無效的有罪判決；（4）青少年司法系統的決定；（5）7年前的有罪判決；以及（6）重罪/輕罪以外的犯罪行為。雇主在招聘過程開始時，不得問及個人的犯罪史或未定罪的逮捕。這包括透過職位申請表、非正式談話或其他方式的詢問。</span></p>    <p><span
                        class="cjk">不受禁止事項在聘用過程中必須遵守的規定。。</span><span class="cjk">僅可在進行現場面試或者提供有條件雇用之後，才准許雇主問及個人的定罪史（受到禁止的事項除外）和未定罪的逮捕。做出雇用決定時僅可考慮與個人從事該工作的能力直接相關的有罪判決和未定罪的逮捕。</span></p>    <p><span
                        class="cjk">雇主根據定罪史或未定罪的逮捕採取不/拒絕聘用、解雇或不晉升個人之前，雇主必須給予此人機會提交證據表明該資訊不準確、此人已改過自新或者其他減輕因素。此人有七天時間做出回應，在此期間雇主必須合理延遲時間並重新考慮該不聘佣決定。雇主必須通知此人任何最終的決定。</span></p>    <p><span
                        class="cjk">改過自新的證據包括令人滿意的假釋/緩刑；接受教育/培訓；參加酒精/毒品治療項目；推薦信；以及個人被判有罪的年齡。減輕因素包括促成有罪判決的脅迫、身體或精神虐待以及未得到治療的藥物濫用/精神疾病。</span><span
                        class="cjk">禁止報復。</span><span class="cjk"> 雇主不得因求職者或雇員行使條例規定的權利或者配合勞工標準執行辦公室（OLSE），而對求職者或雇員採取報復行動。</span></p>    <p><span
                        class="cjk">如果您需要更多資訊或者想要舉報您認為違反本條例的雇主，請撥打415-554-5192或者發送電子郵件到FCE@sfgov.org聯繫OLSE。</span></p>    <p><span
                        class="cjk">勞工標準執行辦公室</span></p>    <p><b><span>City Hall, Room 430 1 Dr. Carlton
                        B.</span></b></p>    <p><b><span>Goodlett Place San Francisco CA 94102</span></b></p>    <p><b><span>4685
                        </span></b><span class="cjk">電話 (415) 554-6235 傳真 (415) 554-4791</span></p>    <p><span>
                        &#160;</span></p>    <hr/>    <p><b><u>LOS ANGELES, CALIFORNIA NOTICE IN ENGLISH:</u></b></p>    <p><span>City
                        of Los Angeles, California</span></p>    <p><span>Eric Garceti, Mayor</span></p>    <p><span>Notice
                        to Applicants &#38; Employees</span></p>    <p><span>Fair Chance Initiative for
                        Hiring Ordinance</span></p>    <p><span>These are your rights:</span></p>    <p><span>1.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>An Employer shall not inquire
                        about or seek information about an Applicant&#39;s Criminal History until after
                        a Conditional Offer of Employment has been made to the Applicant*.</span></p>    <p><span>a.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>This includes job solicitations
                        and applications or during any conversations and interviews.</span></p>    <p><span>2.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>If an Employer decides to rescind
                        an offer of employment based on information discovered during the criminal background
                        check, the Employer is required to perform and Individualized Assessment.</span></p>    <p><span>a.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>Individualized Assessment – a
                        written assessment that effectively links the specific aspects of the Applicant&#39;s
                        Criminal History with risks inherent in the duties of the Employment position
                        sought by the Applicant.</span></p>    <p><span>b.<span> &#160; &#160; &#160;
                        &#160; </span></span><span>If the offer is rescinded, the Applicant must receive:
                        Written notification, a copy of the Individualized Assessment, and copies of a
                        ny documentation used in the Employer&#39;s decision.</span></p>    <p><span>3.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>The Applicant has the right to
                        the Fair Chance Process.</span></p>    <p><span>a.<span> &#160; &#160; &#160;
                        &#160; </span></span><span>The Applicant has the opportunity to provide information
                        or documentation to an Employer regarding the accuracy of their Crimnal History
                        or Criminal History Report. Such evidence of rehabilitation or other mitigating
                        factors should be considered in the Employer&#39;s assessment.</span></p>    <p><span>b.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>The Employer is required to hold
                        the job open for at least five (5) business days from the notification date of
                        the proposed adverse action to allow an Applicant to submit such documentation.
                        The Employer is required to review any documentation to reassess their decision.</span></p>    <p><span>For
                        additional information or assistance, call:</span></p>    <p><span>City of Los
                        Angeles</span><br/>    <span>Department of Public Works</span><br/>    <span>Office
                        of Wage Standards</span><br/>    <span>1149 S. Broadway, Suite 300</span><br/>    <span>Los
                        Angeles, CA 90015</span><br/>    <span>Phone: (844) WagesLA – Email: </span><a
                        href="mailto:WagesLA@lacity.org"><span>WagesLA@lacity.org</span></a></p>    <p><span>*Note:
                        Not all applicants are covered under the FCHIO. Please see the ordinance (LAMC
                        189.00) for more details.</span></p>    <p><span>Form FCIHO, Rev 08/18</span></p>    <p><b><u>LOS
                        ANGELES, CALIFORNIA NOTICE IN SPANISH:</u></b></p>    <p><span>City of Los Angeles,
                        California</span></p>    <p><span>Eric Garceti, Mayor</span></p>    <p><span>Aviso
                        para Solicitantes y Empleados<br/> Ordenanza de la &#160;Iniciativa &#160;de Oportunidad
                        Justa para la &#160;Contratacion</span></p>    <p><span>Estos son &#160;sus &#160;derechos:</span></p>    <p><span>1.<span
                        > &#160; &#160; &#160; &#160;</span></span><span>Los Empleadores no pueden preguntar
                        al solicitante sobre los &#160;antecedentes &#160;penales hasta &#160;después
                        &#160;de que se le haya dado al Solicitante* una oferta condicional de empleo.</span></p>    <p><span>a.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>Esto &#160;incluye solicitaciones
                        y solicitudes de empleo o durante cualquier tipo de conversaciones o entrvistas.</span></p>    <p><span>2.<span
                        > &#160; &#160; &#160; &#160;</span></span><span>Si &#160;el Empleador decide
                        &#160;recindir &#160;la oferta de empleo como resultado de la &#160;investigación
                        &#160;de &#160;antecedentes, &#160;el Empleador está obligado a realizer una Evaluación
                        &#160;Individualizada.</span></p>    <p><span>a.<span> &#160; &#160; &#160; &#160;
                        </span></span><span>Evaluación &#160;Individualizada – un &#160;análisis &#160;por
                        escrito de las funciones y responsabilidades del trabajo, los &#160;antecedentes
                        &#160;penales del Solicitante y cualquier otro factores que pueden afectar a la
                        &#160;decisión &#160;de contractacion.</span></p>    <p><span>b.<span> &#160;
                        &#160; &#160; &#160; </span></span><span>Si &#160;se rescinde &#160;la oferta,
                        el Solicitante debe recibir: un aviso por escrito, una copia de la &#160;Evalucion
                        &#160;Individual, y copias de todos los documentos que el Empleador &#160;utilizó
                        &#160;a llegar a la decision.</span></p>    <p><span>3.<span > &#160; &#160; &#160;
                        &#160;</span></span><span>El &#160;solicitante tiene el derecho al proceso de
                        la Oportunidad Justa.</span></p>    <p><span>a.<span> &#160; &#160; &#160; &#160;
                        </span></span><span>El &#160;Solicitante tiene la oportunidad de proporcionar
                        &#160;información &#160;o &#160;documentación &#160;a un Empleador con &#160;respecto
                        &#160;a la &#160;exactitud &#160;de sus Antecedentes Penales. Dichos datos deben
                        ser considerados en la &#160;evaluacioón &#160;del Empleador, como evidencia de
                        &#160;rehabilitación &#160;u otros factores mitigadores.</span></p>    <p ><span>b.<span>
                        &#160; &#160; &#160; &#160; </span></span><span>Se &#160;requiere &#160;que el
                        Empleador mantenga el puesto abierto por lo menos cinco (5) &#160;días &#160;laborales
                        de la fecha de &#160;notificación &#160;de la &#160;acción &#160;adversa propuesta
                        para permitir que &#160;el Solicitante presente &#160;tal &#160;documentación.
                        &#160;El Empleador &#160;está &#160;obligado &#160;revisar cualquier &#160;documentación
                        &#160;para &#160;reevaluar &#160;su &#160;decisión.</span></p>    <p><span>Para
                        &#160;más &#160;información &#160;o asistencia, puede llamar a:</span><br/>    <span>City
                        of Los Angeles</span><br/>    <span>Department of Public Works</span><br/>    <span>Office
                        of Wage Standards</span><br/>    <span>1149 S. Broadway, Suite 300</span><br/>    <span>Los
                        Angeles, CA 90015</span><br/>    <span>Tel</span><span>é</span><span>fono: (844)
                        WagesLA – Email: </span><a href="mailto:WagesLA@lacity.org"><span>WagesLA@lacity.org</span></a></p>    <p><span>*La
                        nota: No todos los solicitantes/empleados est</span><span>á</span><span >n cubierto
                        bajo el FCHIO. Consulte con le ordenanza (LAMC 189.00) para m</span><span>á</span><span>s
                        detalles.</span></p>    <p><span>Form FCIHO, Rev 08/18</span></p>    <hr/>    <p><b><u>PHILADELPHIA,
                        PENNSYLVANIA FAIR CHANCE HIRING LAW</u></b></p>    <p><span>Ensuring people with
                        criminal records have a fair chance to work.</span><b><span> It is illegal in
                        Philadelphia for employers* to ask about your criminal background during the job
                        application process.</span></b></p>    <p><b><span>This means that:</span></b></p>    <p><span>Employers
                        cannot ask about your criminal background on job applications or during any job
                        interview.</span></p>    <p><span>Employers can run your criminal background check
                        ONLY AFTER a conditional offer of employment is made (final hiring depends on
                        the results of your background check).</span></p><ul>    <li>Criminal convictions
                        can be considered ONLY if they occurred less than 7 years from when you apply
                        (not counting time in incarceration).</li>    <li>Arrests that did not lead to
                        conviction cannot be used in employment decisions.</li></ul>    <p><span>If your
                        background check reveals a conviction, the employer must consider:</span></p><ul>    <li>The
                        type of offense and the time that has passed since it occurred;</li>    <li>Its
                        connection to the job you are applying for; and</li>    <li>Your job history,
                        character references, and any evidence of rehabilitation.</li></ul>    <p><span>Employers
                        can reject you based on your criminal record ONLY if you pose an unacceptable
                        risk to the business or to other people.</span></p>    <p><span>If you are rejected,
                        the employer must send the decision to you in writing with a copy of the background
                        report used to make the decision.</span></p>    <ul><li>You have 10 days to give
                        an explanation of your record, proof that it is wrong, or proof of rehabilitation.</li></ul>    <p><span>If
                        you believe your employer has violated the law, you can file a complaint with
                        the PCHR.</span></p>    <p><span>Philadelphia Commission on Human Relations</span><br/>    <span>601
                        Walnut Street, Suite 300 South</span><br/>    <span>Philadelphia,PA 19106</span><br/>    <span>(p)
                        215-686-4670 (f) 215-686-4684</span><br/>    <span>email: </span><a href="mailto:pchr@phila.gov"><span>pchr@phila.gov</span></a><br/>    <a
                        href="http://www.phila.gov/humanrelations"><span>www.phila.gov/humanrelations</span></a></p>    <p><span>*Some
                        employers are exempt</span></p></div>'
