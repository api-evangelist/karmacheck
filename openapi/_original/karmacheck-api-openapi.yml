            - serviceGroupServicesId
            properties:
              serviceGroupId:
                type: string
              serviceGroupName:
                type: string
              serviceGroupPrice:
                type: number
                description: The price of the package in United States cents. This is the price that candidates
                  will pay via Stripe during onboarding to begin their check. Customers can request that
                  a price be set on a package to pass on some or all of the price of the check to the
                  candidate.
              serviceGroupDescription:
                type: string
              serviceId:
                type: string
                description: The unique ID of the service. See [Service](docs/reference/service.md) for
                  a list of possible services.
              serviceName:
                type: string
                description: The name of the service.
              serviceDescription:
                type: string
              serviceTypeId:
                $ref: '#/components/schemas/ServiceTypeId'
              serviceTypeName:
                $ref: '#/components/schemas/ServiceTypeName'
              serviceSubTypeId:
                type: string
                enum:
                - jurisdiction-nationwide
                - jurisdiction-district
                - jurisdiction-statewide
                description: The ID of the subtype for the service. This is applicable only when `serviceId`
                  is `ee774b82-a411-4e2b-a38f-c0641bd836e7` (Federal Criminal Search).
              serviceSubTypeName:
                type: string
                enum:
                - Nationwide
                - District
                - Statewide
                description: The service subtype.
              serviceGroupEnabled:
                type: boolean
              serviceEnabled:
                type: boolean
              serviceAutoProcessEnabled:
                type: boolean
                description: True if the service is available for a case that's ordered using the PII
                  entry flow. False if the service is unavailable when using the PII entry flow.
              serviceTypeEnabled:
                type: boolean
              serviceCategory:
                $ref: '#/components/schemas/ServiceCategory'
              serviceCategoryId:
                $ref: '#/components/schemas/ServiceCategoryId'
              serviceSubCategory:
                $ref: '#/components/schemas/ServiceSubCategory'
              serviceSubCategoryId:
                $ref: '#/components/schemas/ServiceSubCategoryId'
              conditional:
                type: boolean
                description: True if the service is available only when adding to an order; false otherwise.
                  A conditional service indicates that another service needs to run before this service
                  can run.
              defaultSelected:
                type: boolean
                description: True if the service is selected by default when a dashboard user selects
                  the package for a case; false otherwise.
              serviceGroupServicesId:
                type: string
    DocumentCreateRecords:
      title: DocumentCreateRecords
      type: object
      required:
      - list
      properties:
        list:
          type: array
          items:
            type: object
            required:
            - originalFileName
            - documentTypeId
            - fileKey
            properties:
              originalFileName:
                type: string
                description: The file name for the document that was uploaded.
              documentTypeId:
                type: string
                description: 'The type of document to store.


                  Allowed value: `candidate-disclosures-and-authorizations`'
              fileKey:
                type: string
                description: The value from the [Generate secure document upload URLs](karma-api-openapi.yaml/paths/~1document~1secure~1upload/post)
                  response.
              title:
                type: string
                description: A title for the document.
              description:
                type: string
                description: A description of the document.
              fileFormat:
                description: The file format (e.g. pdf, jpeg, png)
                type: string
                enum:
                - pdf
                - jpg
                - jpeg
                - png
        accessGrants:
          type: object
          required:
          - caseId
          properties:
            caseId:
              type: string
              description: The ID of the case to associate with the document.
    DocumentRecords:
      title: DocumentRecords
      type: object
      required:
      - list
      properties:
        list:
          type: array
          items:
            type: object
            required:
            - secureDocumentId
            properties:
              secureDocumentId:
                type: string
                description: The unique identifier for the secure document.
    DocumentFiles:
      title: DocumentFiles
      type: object
      required:
      - files
      properties:
        files:
          type: array
          description: An array that enables the generation of upload URLs for multiple files at once.
            Note that the order matters. Make sure to upload the first file to the first URL, and so on.
          items:
            type: object
            required:
            - documentTypeId
            - mimeType
            properties:
              documentTypeId:
                type: string
                description: 'The ID for the type of document to be uploaded.


                  Allowed value: `candidate-disclosures-and-authorizations`'
              mimeType:
                type: string
                description: The MIME type of the file to be uploaded. See [Get secure document MIME types](karma-api-openapi.yaml/paths/~1document~1secure~1mimetypes/get)
                  for details.
    DocumentList:
      title: DocumentList
