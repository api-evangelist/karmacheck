        testimony with proper codes.
      operationId: get-candidate-countries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - list
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      required:
                      - iso31662
                      - iso31663
                      - country
                      properties:
                        iso31662:
                          type: string
                          description: The two-character ISO-3166 code for the country.
                        iso31663:
                          type: string
                          description: The three-character ISO-3166 code for the country.
                        country:
                          type: string
                          description: The name of the country.
              examples:
                Example 1:
                  value:
                    list:
                    - iso31662: US
                      iso31663: USA
                      country: United States
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      security:
      - JWT: []
