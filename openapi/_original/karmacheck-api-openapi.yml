  /document/secure/create:
    parameters: []
    post:
      tags:
      - Secure documents
      summary: Create secure document records
      description: 'Creates secure document records in the KarmaCheck system and associates uploaded documents
        with an existing case.


        This is step 3 of 3 when adding documents to KarmaCheck. At this stage, you should have successfully
        uploaded your documents via the URLs obtained from the [Generate secure document upload URLs](paths/~1document~1secure~1upload/post)
        API call. The uploaded documents are unavailable for use in KarmaCheck until they are associated
        with a case in this third step.


        Document associations are identified by sending access grants. If your token does not have access
        to associate a document with a specific entity, a 403 Forbidden response will be returned.


        In addition to associating a document with an existing case, you can call this API to create candidate
        disclosure and authorization document records before a case is created. When [creating a case](paths/~1case~1create/post),
        you can send the newly created document IDs to associate these documents with the case and the
        candidate. Note that this association is allowed only when the document type is a candidate disclosure
        or authorization.'
      operationId: post-document-secure-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreateRecords'
              x-examples:
                Example 1:
                  list:
                  - originalFileName: example_document.jpg
                    documentTypeId: candidate-disclosures-and-authorizations
                    fileKey: 1daa3c43-ea4e-4d66-9330-0cbd197feee6
                  accessGrants:
                    caseId: 22e88848-17d1-4946-bbac-18d44f381ca7
            examples:
              Candidate disclosure document:
                value:
                  list:
                  - originalFileName: example_document.jpg
                    documentTypeId: candidate-disclosures-and-authorizations
                    fileKey: 1daa3c43-ea4e-4d66-9330-0cbd197feee6
                  accessGrants:
                    caseId: 22e88848-17d1-4946-bbac-18d44f381ca7
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentRecords'
                x-examples:
                  Example 1:
                    list:
                    - secureDocumentId: 7225e58b-55a3-49ad-af82-2b3ab9595741
              examples:
                Example 1:
                  value:
                    list:
                    - secureDocumentId: f6723gd8-ee70-4db3-b238-6bb27abf66c0
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '413':
          description: Request Entity Too Large
        '500':
          description: Internal Server Error
  /document/secure/upload:
    post:
      tags:
      - Secure documents
      summary: Generate secure document upload URLs
      description: 'Generates short-lived URLs that can be used to upload one or more secure documents
        to the KarmaCheck system. This API call is step 1 of 3 when adding a document to the system and
        linking it to a case.


        The returned URLs expire after 1 hour. If an attempt to use an expired URL occurs, the server
        responds with a 403 HTTP status code.'
      operationId: post-document-secure-upload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentFiles'
            examples:
              Example 1:
                value:
                  files:
                  - documentTypeId: candidate-disclosures-and-authorizations
                    mimeType: application/pdf
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - list
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      required:
                      - url
                      - fileKey
                      properties:
                        url:
                          type: string
                          format: uri
                          description: The URL to upload the document to. This expires after 1 hour.
                        fileKey:
                          type: string
                          description: The identifier used to reference the file in KarmaCheck's storage
                            system. This must be included in the [Create secure document records](karma-api-openapi.yaml/paths/~1document~1secure~1create/post)
                            call.
