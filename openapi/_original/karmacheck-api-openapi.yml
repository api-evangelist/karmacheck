  /case/id/{caseId}/{disclosureType}/{language}:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The ID of a case.
    - schema:
        type: string
        enum:
        - disclosures
        - customdynamicdisclosure
      name: disclosureType
      in: path
      required: true
      description: The type of disclosure.
    - $ref: '#/components/parameters/language'
    put:
      tags:
      - Candidate onboarding
      summary: Acknowledge location-specific disclosures
      description: Submits acknowledgement of location-specific disclosures for tracking and auditing
        purposes. This action creates a case data record with the provided information. The system records
        the acknowledgment and generates a downloadable PDF file of the acknowledged disclosures.
      operationId: put-case-id-caseId-disclosureType-language
      parameters:
      - name: language
        in: path
        required: true
        schema:
          type: string
        description: The language code (e.g. en-US)
      requestBody:
        description: 'All disclosures that are returned in the [Request location-specific disclosures](paths/~1case~1id~1{caseId}~1{disclosureType}~1{language}/post)
          API call must be included. If any expected disclosures are *not* acknowledged in this request,
          the entire request will be rejected and nothing will be saved for this request.


          <!-- theme: info -->

          > ##### Note

          >

          > Inclusion of a `legalType` in the request list indicates that the candidate acknowledged that
          legal disclosure via an input. The client should *not* include the `legalType` in the post request
          until that acknowledgement happens.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalAcknowledgmentDisclosures'
            examples:
              Example 1:
                value:
                  sendReport: true
                  list:
                  - legalType: general-ca-disclosure
                    signature: Alex Smith
                  - legalType: state-city-all-disclosure
                  - legalType: custom-ab-ca-disclosure-1
                    signature: Alex Smith
                  - legalType: custom-ab-ca-disclosure-2
                    signature: Alex Smith
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '404':
          description: The case was not found.
        '422':
          description: 'This response indicates one of the following:

            - The candidate already acknowledged all disclosures of this type.

            - The case doesn''t have this disclosure in its service group.

            - The request doesn''t have all of the required data for all of the disclosures.'
        '500':
          description: Internal Server Error
    post:
      tags:
      - Candidate onboarding
      summary: Request location-specific disclosures
      description: Retrieves location-specific disclosure documents and forms that can be presented to
        and acknowledged by the candidate as part of the onboarding process.
      operationId: post-case-id-caseId-disclosureType-language
      parameters:
      - name: language
        in: path
        required: true
        schema:
          type: string
        description: The language code (e.g. en-US)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - opportunityState
              - addressState
              properties:
                opportunityState:
                  type: string
                  description: The state associated with the opportunity, such as the location of a job
                    for which a candidate is undergoing a background check.
                opportunityCity:
                  type: string
                  description: The city associated with the opportunity, such as the location of a job
                    for which a candidate is undergoing a background check.
                addressState:
                  type: string
                  description: The candidate's state of residence.
                addressCity:
                  type: string
                  description: The candidate's city of residence.
        description: 'Required disclosures vary from locale to locale, so location information in the
          request is used to return the relevant documents.


          Once *all* disclosures have been [acknowledged](paths/~1case~1id~1{caseId}~1{disclosureType}~1{language}/put),
          calling this endpoint again will indicate that with `alreadyAck` and provide the `caseDataId`
          of the acknowledgment, which can be used to retrieve details. These can be used to determine
          whether the candidate can skip this step if they leave and then continue their onboarding later
          or another device, for example. Additionally, the location data in the request will be ignored.


          However, if this endpoint is called again while some or all disclosures from the previous response
          remain unacknowledged, the endpoint will use the location information in the current request
          to return new documents and previously saved data will be discarded.

          '
