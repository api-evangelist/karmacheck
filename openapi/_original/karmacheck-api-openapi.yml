          description: The name of the institution where the candidate received their education.
        city:
          type: string
          description: The city in which the institution is located. Recommended to be included in *all*
            requests.
        state:
          type: string
          description: The two-letter state code. Recommended to be included in *all* requests.
          example: NY
        country:
          type: string
          description: The ISO 3166 (2 or 3 letter) code. Recommended to be included in *all* requests.
          example: US
        nameIfDifferent:
          type: string
          description: The candidate's name that's on record with the institution.
        educationType:
          example: College/University
          description: The type of education, such as a college or university, a high school or equivalent
            (for example, GED), a technical or trade school, or other.
          type: string
        current:
          type: boolean
          default: false
          description: If true, the candidate is currently enrolled at the institution. If false, the
            candidate is not currently enrolled. (Required true if `monthEnd` and `yearEnd` are not provided)
        degree:
          type: string
          description: The educational degree.
        major:
          type: string
          description: The candidate's field of study.
        gpa:
          type: string
          description: The candidate's grade point average (GPA).
        monthBegin:
          type: string
          description: The month in which the candidate began their education.
        yearBegin:
          type: string
          description: The year in which the candidate began their education.
        monthEnd:
          type: string
          description: The month in which the candidate completed their education. Not applicable if `current`
