          type: string
        contact:
          $ref: '#/components/schemas/TestimonyContact'
          description: The institution's contact information.
    TestimonyEmploymentCreate:
      title: TestimonyEmployment
      type: object
      description: The testimony details when `testimonyTypeId` is `aa99dc08-0238-4050-9176-bf322e077f71`.
        **Note:** Multiple properties are currently optional, but are strongly recommended to be included
        in requests.
      required:
      - employer
      - city
      - state
      - country
      - current
      - position
      - monthBegin
      - yearBegin
      - monthEnd
      - yearEnd
      properties:
        employer:
          type: string
          description: The name of the candidate's current or former employer. Must be less than or equal
            to 100 characters.
        city:
          type: string
          description: The city of employment. Recommended to be included in *all* requests.
        state:
          type: string
          description: The two-letter state code. Recommended to be included in *all* requests.
        country:
          type: string
          description: The ISO 3166 (2 or 3 letter) code. Recommended to be included in *all* requests.
        nameIfDifferent:
          type: string
          description: The candidate's name that's on record with the employer.
        current:
          type: boolean
          description: If true, the candidate is currently employed with the employer. If false, the candidate
            is no longer employed with the employer. Recommended to be included in *all* requests. (Required
            true if `monthEnd` and `yearEnd` are not provided)
          default: false
        okToContact:
          type: boolean
          description: If true, the employer can be contacted about the candidate. If false, the employer
            cannot be contacted. Recommended to be included in *all* requests.
        position:
          type: string
          description: The candidate's position with the employer.
        incomeAmount:
          type: string
          description: The amount earned.  Recommended to be included for Employment Income Verification.
        incomeCurrency:
          type: string
          description: The currency of the income earned. This is applicable to Employment Income Verification.
        incomeFrequency:
          type: string
          description: The frequency of the amount earned. Recommended to be included for Employment Income
            Verification.
        monthBegin:
          type: string
          description: The month in which the candidate began their employment.
        yearBegin:
          type: string
          description: The year in which the candidate began their employment.
        monthEnd:
          type: string
          description: The month in which the candidate ended their employment. Not applicable if `current`
            is true. (Required if `current` is false or not provided)
        yearEnd:
          type: string
          description: The year in which the candidate ended their employment. Not applicable if `current`
            is true. (Required if `current` is false or not provided)
        additionalInfo:
          type: string
        contact:
          $ref: '#/components/schemas/TestimonyContact'
          description: The employer's contact information.
        staffingAgency:
          type: string
          description: The Staffing Agency that the candidate is working for the employer through.(If
            applicable)
          maxLength: 100
