      description: The testimony details when `testimonyTypeId` is `19edb27e-5bfd-4c0f-888a-a5130b2f5250`.
        **Note:** Multiple properties are currently optional, but are strongly recommended to be included
        in requests.
      required:
      - institution
      - city
      - state
      - country
      - current
      - monthEnd
      - yearEnd
      properties:
        institution:
