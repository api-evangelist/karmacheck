    UserGetUserByGroup:
      title: User
      type: object
      description: This model represents a User entity that is returned by the Get Users By Group Profile
        API.
      required:
      - id
      - givenName
      - familyName
      - enabled
      properties:
        id:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        enabled:
          type: integer
          enum:
          - 1
          - 0
          description: 'A boolean integer: 1 (true) if the user''s account is enabled in KarmaCheck; 0
            (false) if the user account is disabled.'
    UserGetUserByGroupInternal:
      title: User (Internal)
      type: object
      description: This model represents a User entity that is returned by the Get Users By Group Profile
        API.
      required:
      - id
      - givenName
      - familyName
      - enabled
      properties:
        id:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        enabled:
          type: integer
          enum:
          - 1
          - 0
          description: 'A boolean integer: 1 (true) if the user''s account is enabled in KarmaCheck; 0
            (false) if the user account is disabled. By default, all users are returned. Control by passing
            `includeDisabled=true|false` as a query param.'
        username:
          type: string
          format: email
          description: Not returned by default. Control by passing `includeEmail=true|false` as a query
            param.
        mfa:
          type: object
          description: Not returned by default. Control by passing `includeMfa=true|false` as a query
            param.
          required:
          - enrollments
          properties:
            enrollments:
              type: array
              items:
                $ref: '#/components/schemas/MFAEnrollment'
    MFAEnrollment:
      type: object
      examples:
      - id: bded5fd7-7c33-4984-8edd-3fee6f3ef3f5
        activatedStamp: '2025-12-16T19:23:55.000Z'
        crStamp: '2025-12-16T19:23:16.000Z'
        label: 1Password (Work Mac)
        lastUsedStamp: '2025-12-16T19:23:55.000Z'
        lastVerifiedStamp: '2025-12-16T19:23:55.000Z'
        method: totp
        modStamp: '2025-12-16T19:24:10.000Z'
        status: revoked
        revokedBy:
          id: 3bedd2fc-3c87-495a-a3f8-a30daa73004c
          username: me@example.com
          revokedStamp: '2025-12-16T19:24:10.000Z'
      title: MFA Enrollment
      required:
      - id
      - crStamp
      - modStamp
      - label
      - method
      - status
      properties:
        id:
          type: string
          description: A unique ID associated with the MFA enrollment.
        crStamp:
          type: string
          format: date-time
          description: The UTC timestamp when the MFA enrollment was created.
          example: '2025-11-05T18:35:34.431Z'
        modStamp:
          type: string
          format: date-time
          description: The UTC timestamp when the MFA enrollment was last modified.
          example: '2025-11-05T18:35:34.431Z'
        activatedStamp:
          type: string
          format: date-time
          description: The UTC timestamp when the MFA enrollment was activated.
          example: '2025-11-05T18:35:34.431Z'
        lastUsedStamp:
          type: string
          description: The UTC timestamp when the MFA enrollment was last used for a verification attempt.
          example: '2025-11-05T18:35:34.431Z'
          format: date-time
        lastVerifiedStamp:
          type: string
          format: date-time
          description: The UTC timestamp when a challenge against this MFA enrollment was last verified.
          example: '2025-11-05T18:35:34.431Z'
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: The human-friendly label associated with the MFA enrollment.
          example: 1Password (Work Mac)
          default: Device
        method:
          enum:
          - totp
          description: The MFA enrollment method, such as time-based one-time password.
        status:
          enum:
          - active
          - revoked
          - pending
          description: The current status of the MFA enrollment.
        revokedBy:
          type: object
          description: Details about the MFA enrollment's revocation, if its status is "revoked".
          required:
          - id
          - username
          - revokedStamp
          properties:
            id:
              type:
              - string
              - 'null'
              description: The ID of the user that revoked the MFA enrollment.
            username:
              type:
              - string
              - 'null'
              description: The username of the user that revoked the MFA enrollment.
            revokedStamp:
              type: string
              format: date-time
              example: '2025-11-05T18:35:34.431Z'
              description: The UTC timestamp when the MFA enrollment was revoked.
    SearchDetails:
      title: searchDetails
      type: object
      required:
      - vbookTypeId
      properties:
        vbookTypeId:
          type: string
          description: The type of vBook items you want returned. Currently only supports employment(vbt_employment)
            and education(vbt_education).
