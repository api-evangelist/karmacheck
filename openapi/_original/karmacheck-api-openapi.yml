  /invitation/candidate/create:
    post:
      tags:
      - Candidate onboarding
      summary: Create candidate by proxy for invitation
      description: 'Creates the candidate object in KarmaCheck on behalf of the candidate so that there
        can be pre-population of PII before the candidate accepts an invitation and enters the system.

        The candidate will be directed to onboard the associated case via the one-time token link that
        will be provided by the API partner.


        This API marks the candidate object as not secured in the KarmaCheck system, which results in
        the candidate being prompted to set a password when the onboarding of the case begins.

        After this call is complete, the candidate will be associated with the specific `caseId` that
        was attached to the invitation. The `caseId` will be used for saving all further case data, such
        as authorizations and acknowledgements. This assumes that a candidate will need to sign up with
        KarmaCheck before being able to continue to accept the invitation.

        '
      operationId: post-invitation-candidate-create
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - caseInvitationId
              - email
              - password
              properties:
                caseInvitationId:
                  type: string
                email:
                  type: string
                  description: The candidate's email address.
                password:
                  type: string
                  description: The password for the candidate's account. The supplied password must be
                    at least eight characters long and must contain a lowercase letter, an uppercase letter,
                    a number, and a special character.
                givenName:
                  type: string
                middleName:
                  type: string
                familyName:
                  type: string
                dob:
                  type: string
                  description: The candidate's birthdate in the format *YYYY*-*MM*-*DD*.
                  format: date
                phone:
                  type: string
                govtId:
                  type: string
            examples:
              Example 1:
                value:
                  caseInvitationId: e1f27fde-8ec3-4fa2-abfe-43b7c9f43084
                  email: john.lee@example.com
                  password: Password!1
                  givenName: John
                  middleName: Michael
                  familyName: Lee
                  dob: '1980-09-19'
                  phone: 800-555-0142
                  govtId: 111-11-1111
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId:
                    type: string
                  candidateId:
                    type: string
              examples:
                Example 1:
                  value:
                    caseId: af51d69f-996a-4891-a745-aadfcdec225a
                    candidateId: 10f4deb6-fd4e-4907-a47e-355caf6e449d
        '400':
          description: An invalid `email`, `password`, or `dob` format was passed.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '404':
          description: An invalid `caseInvitationId` was passed.
        '422':
          description: 'The candidate cannot be created due to one of the following:


            - The invitation expired.

            - The invitation was deleted.

            - The invitation was completed.

            - The invitation is already associated with another candidate.

            - An account already exists for the candidate.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  caseId:
                    type: string
                  candidateId:
                    type: string
        '500':
          description: Internal Server Error
      security:
      - JWT: []
  /testimony/create/case/id/{caseId}:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The identifier of the case for which to create a testimony.
    post:
      tags:
      - Candidate onboarding
      summary: Create testimony for case
      description: 'Stores personally identifiable information (PII) on a candidate in KarmaCheck. Only
        one piece of PII can be included in a single piece of testimony.


        Testimony is owned by the candidate, and can be attached to a case. When testimony is attached
        to a case, a separate case testimony record is created, which then becomes part of the case.'
      operationId: post-testimony-create-case-id-caseId
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Testimony'
            examples:
              Education testimony:
                value:
                  testimonyTypeId: 19edb27e-5bfd-4c0f-888a-a5130b2f5250
                  details:
                    institution: UCLA
                    city: Los Angeles
                    state: CA
                    country: US
                    educationType: College/University
                    current: false
                    degree: B.S.
                    major: Nursing
                    monthBegin: September
                    yearBegin: '2015'
                    monthEnd: May
                    yearEnd: '2019'
              Professional License and Certification testimony:
                value:
                  testimonyTypeId: testimony-type-cplc
                  testimonySubType: 512d0d24-a4bd-4b1d-b6d1-182247a0f6ec
                  details:
                    cplcId: 512d0d24-a4bd-4b1d-b6d1-182247a0f6ec
                    fields:
                    - fieldId: certifyingBody
                      value: AMTA
                    - fieldId: licenseNumber
                      value: M123456
                    - fieldId: firstName
                      value: John
                    - fieldId: lastName
                      value: Smith
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                properties:
                  id:
                    type: string
                    description: The unique identifier of the testimony created.
                    format: uuid
              examples:
                Example 1:
                  value:
                    id: e0c9c732-68ea-4f73-857d-d37f1c9e2028
        '403':
          description: Forbidden
        '422':
          description: The request data is invalid or incomplete.
        '500':
          description: Internal Server Error
  /testimony/id/{testimonyId}/detach/case/id/{caseId}:
    parameters:
    - in: path
      name: testimonyId
      required: true
      description: The ID of the testimony to remove from a case.
      schema:
        type: string
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The identifier of the case.
    delete:
      tags:
      - Candidate onboarding
      summary: Detach testimony from case
      description: 'Removes previously attached testimony from a case.


        If the testimony is not attached to the supplied case, then calling this endpoint generates an
        error with 404. If the case has finished onboarding, then this call will fail with 403.

        If the testimony has not been attached to any other case, then detaching will result in deletion
        of the testimony from the system.'
      operationId: delete-testimony-id-testimonyId-detach-case-id-caseId
      parameters: []
      responses:
        '200':
          description: OK
        '403':
          description: 'Forbidden: Case has finished onboarding.'
        '404':
          description: 'Not Found: Testimony not attached to supplied case.'
        '500':
          description: Internal Server Error
      security:
      - JWT: []
  /candidate/invitation/token/{invitationToken}:
    parameters:
    - schema:
        type: string
        example: 84729060-f3f3-42fc-88fe-c5ac3da46d41
      name: invitationToken
      in: path
      required: true
      description: The token used for the invitation. This can be retrieved from [Get invitation for case
        ID](karma-api-openapi.yaml/paths/~1invitation~1case~1{caseId}/get).
    get:
      tags:
      - Candidate onboarding
      summary: Get candidate for invitation
      description: Retrieves the candidate information associated with an invitation.
      operationId: get-candidate-invitation-token-invitationToken
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - caseId
                - candidateId
                - legalStarted
                properties:
                  caseId:
                    type: string
                    description: The ID of the case associated with the candidate and invitation.
                  candidateId:
                    type: string
                    description: The ID of the candidate associated with the invitation.
                  legalStarted:
                    type: boolean
                    description: True if the candidate began authorization of legal checks (for example,
                      acknowledged a disclosure); false otherwise.
              examples:
                Example 1:
                  value:
                    caseId: 6f84bc4b-9206-49e4-92b2-529c3d5990b3
                    candidateId: 56730732-b977-4e1f-b6d4-ffd96c51ff5b
                    legalStarted: false
        '403':
          description: Forbidden
        '422':
          description: 'The invitation is no longer valid due to one of the following:

            - The invitation expired.

            - The invitation was canceled and deleted.

            - The invitation was completed. In other words, a candidate acknowledged the invitation and
            completed the onboarding process.

            '
          content:
            application/json:
              schema:
                type: string
              examples:
                Example 1:
                  value: Token is not valid
        '500':
          description: 'An error occurred on KarmaCheck''s end.


            **Known issue:** The API returns this error instead of a 4xx response when either of the following
            occurs:

            - The invited candidate hasn''t initiated the onboarding process.

            - The invitation token provided is invalid.'
          content:
            application/json:
              schema:
                type: string
              examples:
                Example 1:
                  value: Server Error
  /candidate/countries:
    get:
      tags:
      - Candidate onboarding
      summary: Get countries
