            candidate is not currently enrolled. Recommended to be included in *all* requests. (Required
            true if `monthEnd` and `yearEnd` are not provided)
          default: false
        monthEnd:
          type: string
          description: The month in which the candidate completed their education. (Required if `current`
            is false or not provided)
        yearEnd:
          type: string
          description: The year in which the candidate completed their education. (Required if `current`
            is false or not provided)
        nameIfDifferentFlag:
          type: boolean
          description: If true, the candidate attended or is attending the institution under a different
            name. If false, the candidate's name on record with the institution is the same as the candidate's
            name recorded for the case.
        nameIfDifferent:
          type: string
          description: The candidate's name that's on record with the institution.
        contact:
          type: object
          description: The institution's contact information. **Known issue:** The API currently requires
            this object to be passed (either empty or with any of its optional properties).
          properties:
            website:
              type: string
            email:
              type: string
            phone:
              type: string
        secureDocumentIds:
          type: array
          description: The IDs of uploaded secure documents that will be associated to the education record.
            This optional field can be applied when providing data on behalf of the candidate.
          items:
            type: string
    CaseOrderDataEmployment:
      title: CaseOrderDataEmployment
      type: object
      description: 'The candidate data when `caseOrderDataTypeId` is `codt-employment`.

        **Note:** Multiple properties are currently optional, but are strongly recommended to be included
        in requests.'
      required:
      - employer
      - position
      - city
      - state
      - country
      - monthBegin
      - yearBegin
      - current
      - monthEnd
      - yearEnd
      properties:
        employer:
          type: string
          description: The name of the candidate's current or former employer. Must be less than or equal
            to 100 characters.
        position:
          type: string
          description: The candidate's position with the employer.
        city:
          type: string
          description: The city of employment. Recommended to be included in *all* requests.
        state:
          type: string
          description: The two-letter state code. Recommended to be included in *all* requests.
        country:
          type: string
          description: The two-letter country code. Recommended to be included in *all* requests.
        monthBegin:
          type: string
          description: The month in which the candidate began their employment. Recommended to be included
            in *all* requests.
        yearBegin:
          type: string
          description: The year in which the candidate began their employment. Recommended to be included
            in *all* requests.
        current:
          type: boolean
          description: If true, the candidate is currently employed with the employer. If false, the candidate
            is no longer employed with the employer. Recommended to be included in *all* requests. (Required
            true if `monthEnd` and `yearEnd` are not provided)
          default: false
        monthEnd:
          type: string
          description: The month in which the candidate ended their employment. (Required if `current`
            is false or not provided)
        yearEnd:
          type: string
          description: The year in which the candidate ended their employment. (Required if `current`
            is false or not provided)
        contact:
          type: object
          description: The employer's contact information. **Known issue:** The API currently requires
            this object to be passed (either empty or with any of its optional properties).
          properties:
            website:
              type: string
            email:
              type: string
            phone:
              type: string
        okToContact:
          type: boolean
          description: If true, the employer can be contacted about the candidate. If false, the employer
            cannot be contacted. Recommended to be included in *all* requests.
          default: true
        incomeAmount:
          type: string
          description: The amount earned. This is applicable to Employment Income Verification.
        incomeFrequency:
          type: string
          description: The frequency of the amount earned. This is applicable to Employment Income Verification.
          example: Annually
        staffingAgency:
          type: string
          description: The Staffing Agency that the candidate is working for the employer through. (If
            applicable)
          maxLength: 100
        secureDocumentIds:
          type: array
          description: The IDs of uploaded secure documents that will be associated to the employment
            record. This optional field can be applied when providing data on behalf of the candidate.
          items:
            type: string
    CaseOrderDataMVR:
      title: CaseOrderDataMVR
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-mvr`.
      required:
      - state
      - licenseNumber
      properties:
        state:
          type: string
          description: The two-letter state code of the candidate's driver's license.
        licenseNumber:
          type: string
          description: The candidate's driver's license number.
        firstNameIfDifferent:
          type: string
          description: If the name on the driver's license is different than the candidate name entered
            for the case, the first name on the candidate's driver's license.
        middleInitialIfDifferent:
          type: string
          description: If the name on the driver's license is different than the candidate name entered
            for the case, the middle initial on the candidate's driver's license.
        lastNameIfDifferent:
          type: string
          description: If the name on the driver's license is different than the candidate name entered
            for the case, the last name on the candidate's driver's license.
    CaseOrderDataAlias:
      title: CaseOrderDataAlias
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-alias`.
      required:
      - givenName
      - familyName
      properties:
        givenName:
          type: string
          description: Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and
            underscores (_) are allowed.
        middleName:
          type: string
          description: Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and
            underscores (_) are allowed.
        familyName:
          type: string
          description: Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and
            underscores (_) are allowed.
    CaseOrderDataJurisdiction:
      title: CaseOrderDataJurisdiction
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-address`.
      required:
      - city
      - state
      - county
      properties:
        city:
          type: string
          example: Manchester
        state:
          type: string
          description: The two-letter state code.
          example: NH
        county:
          type: string
          example: Hillsborough
        autoProcessJurisdictions:
          type: boolean
          default: false
          description: If true, jurisdiction order data will be automatically created based on the services
            ordered. If false, jurisdiction order data will be specified for the jurisdiction-based search
            type being ordered.
    CaseOrderDataJurisdictionCounty:
      title: CaseOrderDataJurisdictionCounty
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-jurisdiction-county`.
      required:
      - state
      - county
      properties:
        state:
          type: string
          description: The two-letter state code.
          example: NH
        county:
          type: string
          example: HILLSBOROUGH
    CaseOrderDataJurisdictionFederal:
      title: CaseOrderDataJurisdictionFederal
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-fed-district`.
      required:
      - district
      properties:
        district:
          type: string
          example: New Hampshire District Court
    CaseOrderDataJurisdictionState:
      title: CaseOrderDataJurisdictionState
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-jurisdiction-state`.
      required:
      - state
      properties:
        state:
          type: string
          description: The two-letter state code.
          example: NH
    CaseOrderDataCPLC:
      title: CaseOrderDataCPLC
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-cplc`.
      examples:
      - cplcId: cb3dac22-db86-44df-8193-877559b3e8dc
        fields:
        - fieldId: licenseNumber
          value: LN123456
        - fieldId: firstName
          value: Lucian
        - fieldId: lastName
          value: Williams
        - fieldId: state
          value: NY
      required:
      - cplcId
      - fields
      properties:
        cplcId:
          type: string
          description: The unique ID of the professional license or certification. See [Professional license
            and certification](docs/reference/cplc.md) for a list of possible values.
        fields:
          type: array
          description: Details about the candidate's professional license or certification. Call [GET
            `/service/cplc/id/{cplcId}`](karma-api-openapi.yaml/paths/~1service~1cplc~1id~1{cplcId}/get)
            for a list of required fields for the specific professional license or certification.
          items:
            type: object
            required:
            - fieldId
            - value
            properties:
              fieldId:
                type: string
                enum:
                - licenseNumber
                - firstName
                - lastName
                - middleInitial
                - certifyingBody
                - state
                - additionalInfo
                - certifyingBodyMemberId
                - certifyingBodyVerificationPin
                - expirationDate
                - issueDate
                - licenseTitle
                description: The identifier for a specific detail of the professional license or certification.
              value:
                type: string
                description: The candidate's information corresponding to a specific field.
        secureDocumentIds:
          type: array
          description: The IDs of uploaded secure documents that will be associated to the CPLC record.
            This optional field can be applied when providing data on behalf of the candidate.
          items:
            type: string
    CaseOrderDataShipment:
      title: CaseOrderDataShipment
      type: object
      description: The candidate data when `caseOrderDataTypeId` is `codt-shipment`.
      examples:
      - recipientName: John Smith
        address1: 1952 Whitney Avenue
        address2: Unit 2
        addressType: home
        addressSource: homeAddress
        city: Hamden
        state: CT
        postalCode: '06517'
        shippingMethod: Overnight
        maskType: Honeywell DC365 N95
      - recipientName: John Smith c/o KC Clinic
        address1: 1952 Whitney Avenue
        addressType: clinic
        city: Hamden
        state: CT
        postalCode: '06517'
        shippingMethod: Overnight
        maskType: Honeywell DC365 N95
      required:
      - recipientName
      - address1
      - addressType
      - city
      - state
      - postalCode
      - shippingMethod
      - maskType
      properties:
        recipientName:
          type: string
          description: The recipient name.
        address1:
          type: string
          description: The recipient's street address.
        address2:
          type: string
          description: The recipient's street address, continued.
        addressType:
          enum:
          - home
          - clinic
          description: The address type.
        addressSource:
          enum:
          - homeAddress
          - newAddress
          description: The source of the address, which indicates whether the address is the same as the
            candidate's home address. This is used only when `addressType` is `home`.
        city:
          type: string
          description: The recipient's city.
        state:
          type: string
          description: The two-letter state code.
        postalCode:
          type: string
          description: The recipient's zip code.
        shippingMethod:
          description: The shipping method.
          enum:
          - 2-3 Business Days
          - Overnight
        maskType:
          type: string
          description: The mask SKU from [GET `/shipment/mask/list`](karma-api-openapi.yaml/paths/~1shipment~1mask~1list/get).
    CaseOrderDataOHSServiceSubstitutions:
      title: CaseOrderDataOHSServiceSubstitutions
      type: object
      description: 'The order data when `caseOrderDataTypeId` is `codt-ohs-service-substitutions`.  The
        `substitutionMap` is an object where each key is a service ID, and the corresponding value is
        an array of service IDs that are acceptable alternatives for substitution.


        This mechanism is primarily intended for TB blood tests and drug panel services that are either
        identical or functionally equivalent. The goal is to expand clinic availability by allowing flexibility
        in the services that can be used to fulfill an order.'
      examples:
      - substitutionMap:
          service-ohs-tb-quantiferon-gold:
          - service-ohs-tb-quantiferon-gold
          - service-ohs-tb-tspot-test
          service-drug-5-panel:
          - service-drug-5-panel
          - service-drug-300C-crl
          - service-drug-35105N-panel
      properties:
        substitutionMap:
          type: object
          description: The substitutionMap defines service ids that we can consider substituting.  This
            is an object where each key is a service ID, and the corresponding value is an array of service
            IDs that are acceptable alternatives for substitution.
          additionalProperties:
            type: array
            items:
              type: string
    CaseOrderDataDocumentProcessing:
      title: CaseOrderDataDocumentProcessing
      type: object
      required:
      - documentTypeId
      - fileName
      - secureDocumentId
      properties:
        documentTypeId:
          type: string
          enum:
          - unclassified
          description: The identifier of the document type for the document to be processed. For the document
            processing flow this should always be `unclassified`.
        fileName:
          type: string
          description: The name of the file.
          example: sample-file-1.pdf
        secureDocumentId:
          type: string
          description: The identifier for the secureDocumentRecord the document is associated with.
          example: b7e2c1a2-1234-4f8b-9e2a-abcdef123456
    CaseOrderDataDrugReasonForTest:
      title: CaseOrderDataDrugReasonForTest
      type: object
      description: The reason for the drug test.
      examples:
      - reasonForTest: pre-employment
      properties:
        reasonForTest:
          type: string
          enum:
          - pre-employment
          - followup
          - post-accident
          - return-to-duty
          description: The reason for the drug test. Defaults to `pre-employment` if not provided.
          default: pre-employment
    CaseOrderDataDrugTestingAuthority:
      title: CaseOrderDataDrugTestingAuthority
      type: object
      description: The regulatory authority under which a DOT drug test is conducted.
      examples:
      - testingAuthority: fmcsa
      properties:
        testingAuthority:
          type: string
          enum:
          - fmcsa
          - faa
          - fra
          - fta
          - phmsa
          - uscg
          description: The regulatory authority under which a DOT drug test is conducted. Defaults to
            `fmcsa` if not provided.
          default: fmcsa
    Contact:
      title: Contact
      type: object
      description: Details of a contact.
      examples:
      - name: Dana R.
        type: default
        email: defaultcontact@example.com
        phone: 800-555-0150
      - name: Alex P.
        type: escalation
        email: escalationcontact@example.com
      required:
      - type
      - email
      properties:
        name:
          type: string
          maxLength: 255
          description: The name of the contact.
        type:
          type: string
          enum:
          - default
          - escalation
          - authorization
          description: The role of the contact.
        email:
          type: string
          description: The email address of the contact.
          format: email
        phone:
          type: string
          maxLength: 20
          description: The phone number of the contact.
    ConfigValuesAlias:
      title: ConfigValuesAlias
      type: string
      enum:
      - no-alias
      - alias-all
      - alias-all+hits-only
      - alias-mnv
