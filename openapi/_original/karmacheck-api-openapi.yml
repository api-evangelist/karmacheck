components:
  schemas:
    Authentication:
      title: Authentication
      type: object
      examples:
      - id: 7a9af724-a459-49e5-af08-91fc50373818
        username: f08f1be0-9059-467e-a59e-b3721f434375@api.example.com
        token: eyJhbGciOiJIUzI1NiJ9..TvaSgnm0W4XWqYSY1rep4cjPMN2DEDOMIjpKOQMq0zc
        groupProfileId: pe0286f4-ac27-4e36-bfb20-06ae7e392fd2
      required:
      - id
      - username
      - token
      - groupProfileId
      properties:
        id:
          type: string
          description: The unique identifier of the client. This is the same as the JWT ID (`jti` property)
            of the token.
        username:
          type: string
          description: The KarmaCheck username of the client. When this endpoint is first called for a
            particular combination of an `apiKey` and a `clientAccessToken`, a client user is created
            in the KarmaCheck system whose permissions are scoped to the corresponding group. A randomized
            `username` with `api` in the name is generated to make it clear that actions were taken by
            an API client instead of a user of the enterprise dashboard.
        token:
          type: string
          description: A [JSON Web Token](https://jwt.io/) (JWT) that can be used to perform actions like
            ordering checks and getting results for a group of a company. Does not expire, but can be
            revoked upon request or at KarmaCheck's discretion.
        groupProfileId:
          type: string
          description: The ID of the group of the company that the `token` can access.
    LegalAcknowledgmentDisclosure:
      title: LegalAcknowledgmentDisclosure
      type: object
      properties:
        sendReport:
          type: boolean
          description: If true, a report notification will be emailed to the candidate when the report
            is finished.
          default: false
        signature:
          type: string
          description: The name entered into the signature input field on the legal step during candidate
            onboarding. This value might not be exactly the same as the name that the case was ordered
            under.
    LegalAcknowledgmentSignature:
      title: LegalAcknowledgmentSignature
      type: object
      required:
      - signatureType
      - signature
      properties:
        signatureType:
          type: string
          enum:
          - electronic
          - manual
        signature:
          type: string
          description: For candidates who onboarded using KarmaCheck's onboarding experience, the value
            that the candidate entered into the signature input field on the legal step. This might not
            be exactly the same as the name that the case was ordered under.
    LegalAcknowledgmentDisclosures:
      title: LegalAcknowledgmentDisclosures
      type: object
      required:
      - sendReport
      - list
      properties:
        sendReport:
          type: boolean
          description: If true, a report notification will be emailed to the candidate when the report
            is finished.
        list:
          type: array
          items:
            type: object
            required:
            - legalType
            properties:
              legalType:
                $ref: '#/components/schemas/LegalType'
                description: The type of legal disclosure. This is the value returned after calling [Request
