              schema:
                type: object
                required:
                - users
                properties:
                  users:
                    description: A list of users associated with the user's groups or specified group.
                    oneOf:
                    - items:
                        $ref: '#/components/schemas/UserGetUserByGroup'
                    - items:
                        $ref: '#/components/schemas/UserGetUserByGroupInternal'
                    type: array
              examples:
                Example 1:
                  value:
                    users:
                    - id: f7bdbab9-fb9f-4c24-928d-91700030e5bc
                      givenName: John
                      familyName: Doe
                      enabled: 0
                    - id: f7bdbab9-fb9f-4c24-928d-91700030e5ab
                      givenName: Jane
                      familyName: Doe
                      enabled: 1
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '422':
          description: The user has access to the specified group, but the group profile ID is not associated
            with the user's company ID.
