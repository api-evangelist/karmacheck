    CreateCase:
      title: CreateCase
      type: object
      required:
      - packageId
      - email
      - givenName
      - familyName
      properties:
        autoProcess:
          type: boolean
          default: false
          description: If true, the customer is providing all of the information needed to run the check up front; other fields in the payload will be required. If false, the candidate will receive an onboarding invitation to provide the remaining data needed for the check.
        caseTypeId:
          type: string
          enum:
          - cde61186-4f22-45f4-9e19-429061365bce
          default: cde61186-4f22-45f4-9e19-429061365bce
          description: The API currently supports only one type of case, which is a background check.
        packageId:
          type: string
          description: The ID of the package to order for the case. See [Get package list](karma-api-openapi.yaml/paths/~1package~1min~1list/get) to retrieve the list of available packages.
        email:
          type: string
          description: The candidate's email address.
        givenName:
          type: string
          description: The candidate's first name. Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and underscores (_) are allowed.
        middleName:
          type: string
          description: The candidate's middle name. Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and underscores (_) are allowed.
        familyName:
          type: string
          description: The candidate's last name. Only letters, numbers, hyphens (-), apostrophes ('), commas (,), periods (.), and underscores (_) are allowed.
        phone:
          type: string
          description: If `autoProcess` is true and OHS services exist in the package, a phone number in the format **+[country_code][phone_number]** is required (whether or not any OHS services are being ordered). If `autoProcess` is false, this field is optional.
          example: '+18005550145'
        apiTrackingUser:
          type: string
          description: "An external identifier that you can use \nto help track this case in your own system.\n\nKarmaCheck does not do anything with this field other than include it in webhooks and other API calls,\nso despite its name, you can put any value.\n\nA common use case is for the value to be\nthe email address of the user in your system\nwho ordered the case."
        apiTrackingCode:
          type: string
          description: "An external identifier that you can use \nto help track this case in your own system.\n\nKarmaCheck does not do anything with this field other than include it in webhooks and other API calls,\nso despite its name, you can put any value.\n\nA common use case is for the value to be\nthe identifier of the case in your system."
        disableOptions:
          type: integer
          description: 'A parameter to control how KarmaCheck sends email notifications about the case. By default, KarmaCheck sends an email notifying the candidate when a background check is initiated. Email notifications are standard, as further communication with the candidate might be necessary. To prevent certain emails from being sent, use the following values to disable emails to the candidate or customer:

            - **1:** Prevents sending invite to the candidate

            - **2:** Prevents sending updates to the candidate

            - **4:** Prevents sending notifications to the customer

            - **7:** Disables all email notifications described above'
        excludeServices:
          type: array
          description: If the order should not run one or more services that are defined in the package, then list the IDs of each service. Not all services support exclusion; for example, legal authorizations and SSN Trace are needed for other services being ordered.
          items:
            type: string
        orderOverride:
          type:
          - string
          - 'null'
          default: null
          enum:
          - add
          - replace
          - null
          description: "Indicates how to handle an active case that exists for the same candidate email:\n- Use `add` to create a new case anyway. \n- Use `replace` to archive the existing case and create a new case.\nWithout this field, calling the API returns an error if a case already exists."
        replaceCaseId:
          type: string
          description: The ID of the existing case to replace. Required if `orderOverride` is `replace`.
        candidateConsentProvided:
          type: boolean
          description: If true, acknowledges collection of the candidate's signed disclosures and authorizations. This must be set to true if `autoProcess` is true.
        candidateDisclosuresAndAuthorizationDocumentIds:
          type: array
          description: A list of IDs for each [secure document](karma-api-openapi.yaml/paths/~1document~1secure~1create/post) to associate with the case.
          items:
            type: string
        orderData:
          type: array
          description: The candidate's PII and other required data based on the services being ordered. Required if `autoProcess` is true. Each service has different `metadata` properties based on the specified `caseOrderDataTypeId`. See [Provide order data](docs/guides/order-data.md) for additional details.
          items:
            $ref: '#/components/schemas/CaseOrderData'
        orderConfig:
          $ref: '#/components/schemas/OrderConfig'
