        '500':
          description: Internal Server Error
      security:
      - JWT: []
  /case/id/{caseId}/services/{serviceType}:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
    - schema:
        type: string
        enum:
        - screenings
        - payment
        - idv
        - legal
        - shipment
      name: serviceType
      in: path
      required: true
      description: The type of services to retrieve in the response. If an undefined value is provided, only screenings are returned.
    get:
      tags:
      - Cases
      summary: Get services for case
      description: 'Retrieves a list of services ordered for a case. The list includes services of only one of the following types:


        - **`idv`:** Identity verification services ordered for the case.

        - **`legal`:** Legal checks ordered for the case. Legal checks are the various required authorizations collected from a candidate when they authorize a background check (e-signature, FCRA, and disclosures).

        - **`payment`:** Payment services ordered for the case.

        - **`screenings`:** Screenings ordered for the case.

        - **`shipment`:** Shipments ordered for the case.'
      operationId: get-case-id-caseId-services-serviceType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceGroupServicesCase'
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /case/id/{caseId}/action/place:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The ID of the case to place.
    put:
      tags:
      - Cases
      summary: Place case
      description: Sets the status of a case to Placed in the system. Internally, the API sets the case's status to `Adjudicated` and its result to `Placed`. The secondary status, if any, gets reset.
      operationId: put-case-id-caseId-action-place
      parameters: []
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '404':
          description: The `caseId` provided was not found.
        '422':
          description: The case could not be put into Placed. This is likely because the case is not ready to be placed.
        '500':
          description: Internal Server Error
  /case/id/{caseId}/action/preadverse:
    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
      description: The ID of the case to to begin an adverse action process on.
    post:
      tags:
      - Cases
      summary: Pre-adverse action for case
      description: Begins the adverse action process for a case by putting the case into the Pre-Adverse Action status. This also sends a pre-adverse action notice to the candidate by email, which can also be downloaded from both the customer and candidate dashboards.
      operationId: post-case-id-caseId-action-preadverse
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  reason: The candidate was positive for cocaine in his drug test.
                  adverseScreeningSelections:
                  - service-drug-1200-panel
              properties:
                reason:
                  type: string
                  description: An explanation of why the adverse action process is being initiated for the case.
                adverseScreeningSelections:
                  type: array
                  description: A list of specific `serviceId`s whose results give some basis to begin the adverse action process for the case.
                  items:
                    type: string
            examples:
              Example 1:
                value:
                  reason: The candidate was positive for cocaine in his drug test.
                  adverseScreeningSelections:
                  - service-drug-1200-panel
        description: The request body is optional, but if provided, note that the values in the `reason` and `adverseScreeningSelections` fields will be visible to the candidate in the pre-adverse action notice. This is to give an indication of the reason and specific screenings for which the action is being taken.
      responses:
        '200':
          description: OK
        '403':
          description: This response indicates that you don't have an authentication token, that you have insufficient permissions, or that the `caseId` provided was not found.
        '404':
          description: The `caseId` provided was not found.
        '422':
          description: This response indicates that the case cannot be put into Pre-Adverse Action. This is likely because the case is not in a complete state (which would require that all screenings have gone into some kind of complete status, whether clear or with records found).
        '500':
          description: Internal Server Error
  /case/unarchive/{caseId}:
    parameters:
    - schema:
        type: string
