      operationId: get-case-id-caseId-data-serviceId-pdf
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
          description: The document is not ready.
        '500':
          description: Internal Server Error
      security:
      - JWT: []
