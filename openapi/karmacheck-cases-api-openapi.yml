    parameters:
    - schema:
        type: string
      name: caseId
      in: path
      required: true
    - schema:
        type: string
        enum:
        - notice
        - report
      name: type
      in: path
      required: true
    get:
      tags:
      - Cases
      summary: Get pre-adverse action document
      description: Returns inline the PDF file for the pre-adverse action notice or the case report that was active at the time of the pre-adverse action.
      operationId: get-case-id-caseId-preadverse-type-pdf
      responses:
        '200':
          description: OK
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '422':
