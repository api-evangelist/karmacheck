    CaseOrderDataEmployment:
      title: CaseOrderDataEmployment
      type: object
      description: 'The candidate data when `caseOrderDataTypeId` is `codt-employment`.

        **Note:** Multiple properties are currently optional, but are strongly recommended to be included in requests.'
      required:
      - employer
      - position
      - city
      - state
      - country
      - monthBegin
      - yearBegin
      - current
      - monthEnd
      - yearEnd
      properties:
        employer:
          type: string
          description: The name of the candidate's current or former employer. Must be less than or equal to 100 characters.
        position:
          type: string
          description: The candidate's position with the employer.
        city:
          type: string
          description: The city of employment. Recommended to be included in *all* requests.
        state:
          type: string
          description: The two-letter state code. Recommended to be included in *all* requests.
        country:
          type: string
          description: The two-letter country code. Recommended to be included in *all* requests.
        monthBegin:
          type: string
          description: The month in which the candidate began their employment. Recommended to be included in *all* requests.
        yearBegin:
          type: string
          description: The year in which the candidate began their employment. Recommended to be included in *all* requests.
        current:
          type: boolean
          description: If true, the candidate is currently employed with the employer. If false, the candidate is no longer employed with the employer. Recommended to be included in *all* requests. (Required true if `monthEnd` and `yearEnd` are not provided)
          default: false
        monthEnd:
          type: string
          description: The month in which the candidate ended their employment. (Required if `current` is false or not provided)
        yearEnd:
          type: string
          description: The year in which the candidate ended their employment. (Required if `current` is false or not provided)
        contact:
          type: object
          description: The employer's contact information. **Known issue:** The API currently requires this object to be passed (either empty or with any of its optional properties).
          properties:
            website:
              type: string
            email:
              type: string
            phone:
              type: string
        okToContact:
          type: boolean
          description: If true, the employer can be contacted about the candidate. If false, the employer cannot be contacted. Recommended to be included in *all* requests.
          default: true
        incomeAmount:
          type: string
          description: The amount earned. This is applicable to Employment Income Verification.
        incomeFrequency:
          type: string
          description: The frequency of the amount earned. This is applicable to Employment Income Verification.
          example: Annually
        staffingAgency:
          type: string
          description: The Staffing Agency that the candidate is working for the employer through. (If applicable)
          maxLength: 100
        secureDocumentIds:
          type: array
          description: The IDs of uploaded secure documents that will be associated to the employment record. This optional field can be applied when providing data on behalf of the candidate.
          items:
            type: string
