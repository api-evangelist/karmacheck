    CaseOrderDataEducation:
      title: CaseOrderDataEducation
      type: object
      description: 'The candidate data when `caseOrderDataTypeId` is `codt-education`.

        **Note:** Multiple properties are currently optional, but are strongly recommended to be included in requests.'
      required:
      - institution
      - city
      - state
      - country
      - current
      - monthEnd
      - yearEnd
      properties:
        institution:
          type: string
          description: The name of the institution where the candidate received their education.
        educationType:
          example: College/University
          description: The type of education, such as a college or university, a high school or equivalent (for example, GED), a technical or trade school, or other.
          type: string
        educationTypeDescription:
          type: string
          description: A description of the education type. This should be used when `educationType` is other.
        degree:
          type: string
          description: The educational degree. Recommended when `educationType` is college/university or technical/trade school.
        major:
          type: string
          description: The candidate's field of study. Recommended when `educationType` is college/university or technical/trade school.
        city:
          type: string
          description: The city in which the institution is located. Recommended to be included in *all* requests.
        state:
          type: string
          description: The two-letter state code. Recommended to be included in *all* requests.
        country:
          type: string
          description: The two-letter country code. Recommended to be included in *all* requests.
        monthBegin:
          type: string
          description: The month in which the candidate began their education.
        yearBegin:
          type: string
          description: The year in which the candidate began their education.
        current:
          type: boolean
          description: If true, the candidate is currently enrolled at the institution. If false, the candidate is not currently enrolled. Recommended to be included in *all* requests. (Required true if `monthEnd` and `yearEnd` are not provided)
          default: false
        monthEnd:
          type: string
          description: The month in which the candidate completed their education. (Required if `current` is false or not provided)
        yearEnd:
          type: string
          description: The year in which the candidate completed their education. (Required if `current` is false or not provided)
        nameIfDifferentFlag:
          type: boolean
          description: If true, the candidate attended or is attending the institution under a different name. If false, the candidate's name on record with the institution is the same as the candidate's name recorded for the case.
        nameIfDifferent:
          type: string
          description: The candidate's name that's on record with the institution.
        contact:
          type: object
          description: The institution's contact information. **Known issue:** The API currently requires this object to be passed (either empty or with any of its optional properties).
          properties:
            website:
              type: string
            email:
              type: string
            phone:
              type: string
        secureDocumentIds:
          type: array
          description: The IDs of uploaded secure documents that will be associated to the education record. This optional field can be applied when providing data on behalf of the candidate.
          items:
            type: string
