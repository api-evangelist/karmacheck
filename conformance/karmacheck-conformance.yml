standards:
- id: openapi
  conforms: true
  version: 3.1.0
  evidence: >-
    KarmaCheck authors and publishes an OpenAPI 3.1.0 contract; it is rendered operation-by-operation
    in the public API reference and each reference page embeds the source YAML slice. 69 operations,
    62 paths, 125 component schemas, all 69 carrying a unique operationId.
- id: oauth2
  conforms: partial
  evidence: >-
    The KarmaCheck PRODUCT API does not use OAuth 2.0 — it uses a bespoke apiKey + clientAccessToken
    exchange that mints a non-expiring JWT bearer token. OAuth 2.0 appears only on the
    DOCUMENTATION MCP surface, which serves RFC 8414 authorization-server metadata advertising
    authorization_code, client_credentials and refresh_token grants with PKCE S256 and a single
    scope, mcp:search. Recording this as partial rather than true because the OAuth surface belongs
    to the Mintlify docs platform, not to the screening API.
  evidence_url: https://developer.karmacheck.com/.well-known/oauth-authorization-server
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server on developer.karmacheck.com returns HTTP 200 with a
    conformant metadata document (issuer, authorization_endpoint, token_endpoint,
    registration_endpoint, response_types_supported, grant_types_supported,
    code_challenge_methods_supported, scopes_supported).
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource returns HTTP 200 with `resource` and
