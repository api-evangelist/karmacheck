- id: rfc7519
  name: JSON Web Token
  conforms: true
  evidence: >-
    Authentication is a JWT bearer token minted by POST /auth/api; the contract declares
    securityScheme JWT as http/bearer.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No application/problem+json response anywhere in the 69-operation contract. Errors use a bespoke
