  announced: '2023-04-05'
  evidence: https://www.karmacheck.com/release/karmacheck-receives-soc-2-security-certification
  detail: >-
    KarmaCheck announced completion of a SOC 2 Type 2 examination with a favorable report covering
    security, confidentiality and availability. The site footer carries a standing "SOC 2 Type 2
    Compliance" link. The report itself is not published — there is no trust centre, no
    trust.karmacheck.com (NXDOMAIN, probed 2026-08-23) and no self-serve document request, so the
    claim is a press release rather than an evidence portal.
  caveat: >-
    The announcement is from April 2023. No subsequent renewal has been published, and SOC 2 Type 2
    reports cover a defined observation window, so a reader cannot tell from public material whether
    a current report exists.
