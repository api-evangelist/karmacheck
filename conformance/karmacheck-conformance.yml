domain_standards:
- id: fcra
  name: Fair Credit Reporting Act (15 U.S.C. § 1681)
  conforms: true
  regime: US consumer reporting
  evidence_in_contract: >-
    THIS IS THE DOMAIN SIGNATURE AND IT IS IN THE CONTRACT, not only on a marketing page. The API
    exposes a dedicated FCRA acknowledgement surface — POST/GET /case/id/{caseId}/fcra/{language}
    with schemas LegalAcknowledgmentDisclosure, LegalAcknowledgmentDisclosures and
    LegalAcknowledgmentSignature — and a first-class pre-adverse-action workflow
    (POST /case/id/{caseId}/action/preadverse plus the preadverse PDF retrieval and download
    operations). Pre-adverse action is the FCRA § 1681b(b)(3) procedure; an API that models it as a
    resource is asserting the regime in its object model. The case lifecycle documentation further
    states that once adverse action is initiated a case can no longer be cancelled, which is the
    statutory sequencing made executable.
  evidence_public:
  - https://www.karmacheck.com/notice-to-users-fcra
  - https://www.karmacheck.com/fcra-summary-of-rights
  operations:
  - post-case-id-caseId-fcra-language
  - get-case-id-caseId-fcra-language
  - get-case-id-caseId-legal-status-legalType
  - post-case-id-caseId-action-preadverse
  - get-case-id-caseId-preadverse-type-pdf
  - get-case-id-caseId-preadverse-type-pdf-download
- id: dot-drug-testing
  name: US DOT drug and alcohol testing (49 CFR Part 40)
  conforms: true
  evidence_in_contract: >-
    The contract carries DOT-specific order data types — `codt-drug-reason-for-test` and
    `codt-drug-testing-authority`, added 2026-07-07 — plus the schemas CaseOrderDataDrugReasonForTest
    and CaseOrderDataDrugTestingAuthority. Reason-for-test and testing-authority are Part 40
    concepts, not generic ones.
  operations:
  - post-case-create
  - post-case-id-caseId-add-services
- id: pipeda-canada
  name: Canadian disclosure regime
  conforms: partial
  evidence_in_contract: >-
    Dedicated Canadian disclosure acknowledgement operations
    (POST/GET /case/id/{caseId}/canadadisclosure/{language}) and Canadian criminal record / motor
    vehicle record services separate from their US equivalents. The contract distinguishes the
    jurisdiction rather than treating Canada as an international catch-all; KarmaCheck does not name
    a specific Canadian statute in the docs, so this is recorded as partial.
- id: oig-exclusions
  name: HHS OIG List of Excluded Individuals/Entities
  conforms: true
  evidence_in_contract: >-
    DetailsOIG and DetailsFACIS schemas plus an OIG Exclusions Search service. OIG LEIE and FACIS
    are the named healthcare-exclusion screening sources, and their presence as first-class detail
    types is a healthcare-credentialing domain signature.
- id: nsopw-sex-offender
  name: Sex offender registry search
  conforms: true
  evidence_in_contract: DetailsSexOffender schema and a Sex Offender Search service.
